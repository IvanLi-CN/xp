x-testbox-caps: &testbox-caps
  cap_drop: [ALL]
  cap_add:
    - AUDIT_WRITE
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - FSETID
    - KILL
    - MKNOD
    - NET_BIND_SERVICE
    - NET_RAW
    - SETGID
    - SETPCAP
    - SETUID
    - SYS_CHROOT

services:
  certgen:
    <<: *testbox-caps
    image: ${XP_TEST_CERTGEN_IMAGE:-alpine/openssl:3.5.4}
    entrypoint: [/bin/sh]
    command:
      - -ec
      - |
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -subj /CN=xp-testbox-ca -keyout /tls/ca.key -out /tls/ca.pem
        openssl req -newkey rsa:2048 -nodes -subj /CN=xp-testbox-services \
          -addext subjectAltName=DNS:leader-tls,DNS:systemd,DNS:openrc \
          -keyout /tls/server.key -out /tls/server.csr
        openssl x509 -req -days 1 -in /tls/server.csr -CA /tls/ca.pem -CAkey /tls/ca.key \
          -CAcreateserial -copy_extensions copy -out /tls/server.pem
        cp /etc/ssl/cert.pem /tls/ca-bundle.pem
        cat /tls/ca.pem >> /tls/ca-bundle.pem
        cat > /tls/leader.json <<'EOF'
        {
          "inbounds": [{
            "listen": "0.0.0.0",
            "port": 443,
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "00000000-0000-4000-8000-000000000001"}],
              "decryption": "none",
              "fallbacks": [{"dest": "leader:62416"}]
            },
            "streamSettings": {
              "security": "tls",
              "tlsSettings": {
                "alpn": ["http/1.1"],
                "certificates": [{
                  "certificateFile": "/tls/server.pem",
                  "keyFile": "/tls/server.key"
                }]
              }
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        cat > /tls/local.json <<'EOF'
        {
          "inbounds": [{
            "listen": "0.0.0.0",
            "port": 443,
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "00000000-0000-4000-8000-000000000001"}],
              "decryption": "none",
              "fallbacks": [{"dest": "127.0.0.1:62416"}]
            },
            "streamSettings": {
              "security": "tls",
              "tlsSettings": {
                "alpn": ["http/1.1"],
                "certificates": [{
                  "certificateFile": "/tls/server.pem",
                  "keyFile": "/tls/server.key"
                }]
              }
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
    volumes:
      - test-tls:/tls

  leader:
    <<: *testbox-caps
    image: ${XP_TEST_IMAGE}
    build:
      context: ../..
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      XP_NODE_NAME: leader
      XP_ADMIN_TOKEN: testbox-admin-token-0123456789abcdef
      XP_BIND: 0.0.0.0:62416
      XP_API_BASE_URL: https://leader-tls
      XP_ENABLE_CLOUDFLARE: "false"
      SSL_CERT_FILE: /tls/ca-bundle.pem
      NO_PROXY: leader,leader-tls,systemd,openrc
      no_proxy: leader,leader-tls,systemd,openrc
    volumes:
      - leader-data:/var/lib/xp/data
      - test-tls:/tls:ro

  leader-tls:
    <<: *testbox-caps
    image: ${XP_TEST_IMAGE}
    depends_on:
      certgen:
        condition: service_completed_successfully
      leader:
        condition: service_healthy
    entrypoint: [/usr/local/bin/xray, run, -config, /tls/leader.json]
    volumes:
      - test-tls:/tls:ro

  systemd:
    image: ${XP_HOST_IMAGE_PREFIX}-systemd
    build:
      context: ../..
      dockerfile: scripts/testbox/Dockerfile.host-systemd
      args:
        XP_TEST_IMAGE: ${XP_TEST_IMAGE}
    environment:
      container: docker
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - test-tls:/tls:ro
    cgroup: host
    cap_drop: [ALL]
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
      - SYS_ADMIN
    depends_on:
      certgen:
        condition: service_completed_successfully

  systemd-tls:
    <<: *testbox-caps
    image: ${XP_TEST_IMAGE}
    network_mode: service:systemd
    depends_on:
      systemd:
        condition: service_started
    entrypoint: [/usr/local/bin/xray, run, -config, /tls/local.json]
    volumes:
      - test-tls:/tls:ro

  openrc:
    <<: *testbox-caps
    image: ${XP_HOST_IMAGE_PREFIX}-openrc
    build:
      context: ../..
      dockerfile: scripts/testbox/Dockerfile.host-openrc
      args:
        XP_TEST_IMAGE: ${XP_TEST_IMAGE}
    tmpfs:
      - /run
      - /tmp
    volumes:
      - test-tls:/tls:ro
    depends_on:
      certgen:
        condition: service_completed_successfully

  openrc-tls:
    <<: *testbox-caps
    image: ${XP_TEST_IMAGE}
    network_mode: service:openrc
    depends_on:
      openrc:
        condition: service_started
    entrypoint: [/usr/local/bin/xray, run, -config, /tls/local.json]
    volumes:
      - test-tls:/tls:ro

  artifact:
    <<: *testbox-caps
    image: python:3.12-alpine
    command: [python, -m, http.server, "8080", --bind, 0.0.0.0, --directory, /artifacts]
    volumes:
      - ./artifacts:/artifacts:ro

volumes:
  leader-data:
  test-tls:
