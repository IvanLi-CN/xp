[package]
name = "xp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hmac = "0.12"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["http2", "server", "tokio"] }
rcgen = "0.14"
rand = "0.8"
rustls = { version = "0.23.35", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tokio-stream = "0.1"
tokio-rustls = "0.26.4"
uuid = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
xp-proxy-core = { path = "../xp-proxy-core" }

[dev-dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
h2 = "0.4"
x509-parser = "0.18"
