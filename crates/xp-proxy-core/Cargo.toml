[package]
name = "xp-proxy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
