[package]
name = "xp-proxy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
hex = "0.4"
bytes = "1"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
