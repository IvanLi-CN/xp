id: fixture-policy-typescript-computed-fixture-key
language: TypeScript
severity: error
message: Fixture endpoint kinds and user IDs must not use computed keys.
note: Use a direct kind or user_id key with a fixtureCatalog accessor.
files:
  - web/src/**/*.test.ts
  - web/src/**/*.spec.ts
  - web/tests/**/*.ts
  - web/src/**/*.stories.ts
  - web/.storybook/mocks/**/*.ts
  - web/src/storybook/**/*.ts
  - web/src/demo/fixtures.ts
rule:
  all:
    - kind: computed_property_name
    - regex: "^\\[\\s*['\\\"](kind|user_id)['\\\"]\\s*\\]$"
