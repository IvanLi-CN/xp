id: fixture-policy-tsx-catalog-origin
language: Tsx
severity: error
message: fixtureCatalog must be imported from the approved fixture-policy adapter.
files:
  - web/src/**/*.test.tsx
  - web/src/**/*.spec.tsx
  - web/tests/**/*.tsx
  - web/src/**/*.stories.tsx
  - web/.storybook/mocks/**/*.tsx
  - web/src/storybook/**/*.tsx
rule:
  any:
    - pattern: const fixtureCatalog = $$$
    - pattern: let fixtureCatalog = $$$
    - pattern: var fixtureCatalog = $$$
    - pattern: function fixtureCatalog($$$) { $$$ }
    - pattern: class fixtureCatalog { $$$ }
    - pattern: const { fixtureCatalog } = $$$
    - pattern: let { fixtureCatalog } = $$$
    - pattern: var { fixtureCatalog } = $$$
    - pattern: 'const { $KEY: fixtureCatalog } = $$$'
    - pattern: 'let { $KEY: fixtureCatalog } = $$$'
    - pattern: 'var { $KEY: fixtureCatalog } = $$$'
    - all:
        - kind: array_pattern
        - has:
            stopBy: end
            pattern: fixtureCatalog
    - pattern: 'const { $KEY: { fixtureCatalog } } = $$$'
    - pattern: 'let { $KEY: { fixtureCatalog } } = $$$'
    - pattern: 'var { $KEY: { fixtureCatalog } } = $$$'
    - all:
        - kind: required_parameter
        - regex: '\bfixtureCatalog\b'
    - all:
        - kind: catch_clause
        - regex: '\bfixtureCatalog\b'
    - all:
        - kind: import_statement
        - regex: '^import\s+\{\s*fixtureCatalog\s*\}\s+from\s+["''][^"'']+["''];?$'
        - not:
            regex: '^import\s+\{\s*fixtureCatalog\s*\}\s+from\s+["''](?:@/fixture-policy/catalog|(?:\.\./)+(?:src/)?fixture-policy/catalog)["''];?$'
    - all:
        - kind: import_statement
        - regex: '^import\s+\*\s+as\s+fixtureCatalog\s+from\s+["''][^"'']+["''];?$'
        - not:
            regex: '^import\s+\*\s+as\s+fixtureCatalog\s+from\s+["''](?:@/fixture-policy/catalog|(?:\.\./)+(?:src/)?fixture-policy/catalog)["''];?$'
    - all:
        - kind: import_statement
        - regex: '^import\s+fixtureCatalog\s+from\s+["''][^"'']+["''];?$'
        - not:
            regex: '^import\s+fixtureCatalog\s+from\s+["''](?:@/fixture-policy/catalog|(?:\.\./)+(?:src/)?fixture-policy/catalog)["''];?$'
    - all:
        - kind: import_statement
        - regex: '^import\s+\{[^}]*\bas\s+fixtureCatalog\b[^}]*\}\s+from\s+["''][^"'']+["''];?$'
        - not:
            regex: '^import\s+\{[^}]*\bas\s+fixtureCatalog\b[^}]*\}\s+from\s+["''](?:@/fixture-policy/catalog|(?:\.\./)+(?:src/)?fixture-policy/catalog)["''];?$'
