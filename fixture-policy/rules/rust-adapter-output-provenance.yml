id: fixture-policy-rust-adapter-output-provenance
language: Rust
severity: error
message: Rust fixture adapter accessors must derive values directly from the checked-in catalog.
files:
  - test-fixtures/src/**/*.rs
rule:
  any:
    - all:
        - kind: function_item
        - regex: '^fn '
        - not:
            regex: '^fn (load_catalog|catalog)\('
    - kind: const_item
    - all:
        - kind: static_item
        - not:
            regex: '^static CATALOG: OnceLock<Catalog>'
    - all:
        - kind: function_item
        - regex: '^pub fn '
        - not:
            any:
              - pattern: |
                  pub fn none<$TYPE>() -> Option<$TYPE> {
                    None
                  }
              - has:
                  field: body
                  regex: '^\{\s*(?:&?catalog\(\)(?:[.][A-Za-z_][A-Za-z0-9_]*|\[[^]]+\])+(?:\.clone\(\))?(?:\s+as\s+f64)?|Some\(catalog\(\)(?:[.][A-Za-z_][A-Za-z0-9_]*|\[[^]]+\])+(?:\s+as\s+u32)?\)|serde_json::from_value\(catalog\(\)\.slots\.numbers\[[0-9]+\]\.clone\(\)\)\s*\.expect\("fixture numeric slot is valid"\))\s*\}$'
    - all:
        - kind: string_literal
        - inside:
            stopBy: end
            all:
              - kind: function_item
              - regex: '^pub fn '
        - not:
            inside:
              stopBy: end
              pattern: serde_json::from_value($VALUE).expect($MESSAGE)
    - all:
        - kind: integer_literal
        - inside:
            stopBy: end
            all:
              - kind: function_item
              - regex: '^pub fn '
        - not:
            inside:
              stopBy: end
              pattern: catalog().$GROUP.$FIELD[$INDEX]
