id: fixture-policy-typescript-no-suppression
language: TypeScript
severity: error
message: ast-grep suppression is forbidden in protected fixture sources.
files:
  - web/src/**/*.test.ts
  - web/src/**/*.spec.ts
  - web/tests/**/*.ts
  - web/src/**/*.stories.ts
  - web/.storybook/mocks/**/*.ts
  - web/src/storybook/**/*.ts
  - web/src/demo/fixtures.ts
  - web/src/fixture-policy/**/*.ts
rule:
  all:
    - kind: comment
    - regex: ast-grep-ignore
