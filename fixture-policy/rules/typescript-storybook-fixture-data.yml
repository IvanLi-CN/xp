id: fixture-policy-typescript-storybook-fixture-data
language: TypeScript
severity: error
message: Storybook fixture operational literals must use the fixture catalog.
note: Keep Storybook factories deterministic and source operational values from fixtureCatalog.
files:
  - web/src/fixture-policy/storybook.ts
rule:
  all:
    - kind: pair
    - has:
        field: key
        any:
          - regex: '^(accessHost|access_host|apiBaseUrl|api_base_url|host|hostname|serverNames|server_names|acceptedAuthorities|accepted_authorities|canaryUpstreamUrl|canary_upstream_url|canary_upstream|nodeId|node_id|nodeName|node_name|ownerNodeId|owner_node_id|bootstrapNodeId|bootstrap_node_id|bootstrapNodeName|bootstrap_node_name|bootstrapAccessHost|bootstrap_access_host|bootstrapApiBaseUrl|bootstrap_api_base_url|endpointId|endpoint_id|endpointTag|endpoint_tag|user_id|subscriptionToken|subscription_token|token|secret|password|ip|public_ipv4|selected_public_ip|dest|destination|xray_api_addr|tag|bind|cluster_id|leader_api_base_url|mesh_url|meshBaseUrl|mesh_base_url|publicBaseUrl|public_base_url|publicOrigin|runId|run_id|configHash|config_hash)$'
          - regex: '^(firstSeenAt|first_seen_at|lastSeenAt|last_seen_at|lastProbeAt|last_probe_at|lastSyncedAt|last_synced_at|lastOkAt|last_ok_at|lastFailAt|last_fail_at|downSince|down_since|lastRestartAt|last_restart_at|lastRestartFailAt|last_restart_fail_at|slotStart|slot_start|observedAt|observed_at|occurredAt|occurred_at|windowStart|window_start|windowEnd|window_end|minute|startMinute|start_minute|endMinute|end_minute|createdAt|created_at|updatedAt|updated_at|checkedAt|checked_at|connectedAt|connected_at|generatedAt|generated_at|lastSampleAt|last_sample_at|lastTransitionAt|last_transition_at|lastConnectionStartedAt|last_connection_started_at|cycleStartAt|cycle_start_at|cycleEndAt|cycle_end_at|trackingSince|tracking_since|latestCheckedAt|latest_checked_at|lastSuccessAt|last_success_at|hour)$'
          - regex: '^(latencyMs|latency_ms|probeLatencyMs|probe_latency_ms|latency_p50_ms|latency_p95_ms|availability_1h|availability_24h|mesh_availability_24h|connection_generation|current_connection_requests|requests_5m|connection_starts_5m|requests_1h|connection_starts_1h|trafficBytes|traffic_bytes|uplink_bytes|downlink_bytes|totalBytes|total_bytes|requests|connections|throughput)$'
          - regex: '^(startedAt|started_at|finishedAt|finished_at|completedAt|completed_at|emittedAt|emitted_at|startAt|start_at|endAt|end_at|windowStartAt|window_start_at|windowEndAt|window_end_at)$'
    - has:
        field: value
        not:
          pattern: fixtureCatalog.$GROUP.$ACCESSOR()
    - not:
        all:
          - has:
              field: key
              regex: '^(endpoint_id|endpoint_tag)$'
          - has:
              field: value
              any:
                - pattern: seed.endpointId
                - pattern: seed.endpointTag
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    regex: '^(buildSeries|report)$'
    - not:
        all:
          - has:
              field: key
              regex: '^window_start$'
          - has:
              field: value
              pattern: windowStart
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: report
    - not:
        all:
          - has:
              field: key
              regex: '^window_end$'
          - has:
              field: value
              pattern: minuteFromOffset(windowStart, totalMinutes - 1)
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: report
    - not:
        all:
          - has:
              field: key
              regex: '^minute$'
          - has:
              field: value
              pattern: minuteFromOffset(windowStart, minute)
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: buildSeries
