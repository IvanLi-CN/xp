id: fixture-policy-catalog-keys
language: Json
severity: error
message: Fixture catalog keys must match the fixed schema.
files:
  - fixture-policy/catalog.json
rule:
  all:
    - kind: pair
    - has:
        field: key
        not:
          regex: '^("hosts"|"addresses"|"urls"|"identifiers"|"timestamps"|"metrics"|"lists"|"slots"|"subscription"|"strings"|"numbers"|"stringLists"|"nodeIds"|"endpointIds"|"tags"|"accessHosts"|"apiBases"|"primary"|"secondary"|"tertiary"|"serverPrimary"|"serverSecondary"|"primaryIpv4"|"secondaryIpv4"|"tertiaryIpv4"|"loopback"|"loopback39043"|"loopback49043"|"primaryApi"|"secondaryApi"|"tertiaryApi"|"publicOrigin"|"nodePrimary"|"nodeSecondary"|"nodeTertiary"|"nodeNamePrimary"|"nodeNameSecondary"|"nodeNameTertiary"|"endpointPrimary"|"endpointSecondary"|"endpointTertiary"|"userPrimary"|"userSecondary"|"userTertiary"|"userQuaternary"|"userQuinary"|"tokenPrimary"|"tokenSecondary"|"tokenTertiary"|"tokenQuaternary"|"tokenQuinary"|"clusterPrimary"|"endpointTagPrimary"|"endpointTagSecondary"|"endpointTagTertiary"|"earlier"|"baseline"|"recent"|"later"|"latencyLow"|"latencyHigh"|"trafficBytes"|"availabilityLow"|"availabilityHigh"|"availabilityFull"|"primaryServerNames"|"secondaryServerNames"|"tertiaryServerNames"|"primaryAuthorities"|"tertiaryAuthorities")$'
