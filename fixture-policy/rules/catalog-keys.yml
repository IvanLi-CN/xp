id: fixture-policy-catalog-keys
language: Json
severity: error
message: Fixture catalog keys must match the fixed schema.
files:
  - fixture-policy/catalog.json
rule:
  all:
    - kind: pair
    - has:
        field: key
        not:
          any:
            - regex: '^"(hosts|addresses|urls|identifiers|timestamps|metrics|operations)"$'
            - regex: '^"(lists|slots|subscription|endpoint|quota|user|reality|realityAlternate)"$'
            - regex: '^"(realityKeys|vlessMeta|ssMeta|ssMetaAlternate|ssMetaEscaped)"$'
            - regex: '^"(shortIds|short_ids|reset|strings|numbers|stringLists)"$'
            - regex: '^"(nodeIds|endpointIds|userIds|tags|tokens|accessHosts|apiBases)"$'
            - regex: '^"(primary|secondary|tertiary|serverPrimary|serverSecondary)"$'
            - regex: '^"(primaryIpv4|secondaryIpv4|tertiaryIpv4|loopback)"$'
            - regex: '^"(loopback39043|loopback49043|primaryApi|secondaryApi)"$'
            - regex: '^"(tertiaryApi|canaryHttpsListener|canaryHttpsAlternate)"$'
            - regex: '^"(canaryHttpLoopback|publicFallback|publicOrigin)"$'
            - regex: '^"(nodePrimary|nodeSecondary|nodeTertiary|nodeNamePrimary)"$'
            - regex: '^"(nodeNameSecondary|nodeNameTertiary|endpointPrimary)"$'
            - regex: '^"(endpointSecondary|endpointTertiary|userPrimary|userSecondary)"$'
            - regex: '^"(userTertiary|userQuaternary|userQuinary|tokenPrimary)"$'
            - regex: '^"(tokenSecondary|tokenTertiary|tokenQuaternary|tokenQuinary)"$'
            - regex: '^"(probeRunPrimary|probeRunSecondary|probeConfigPrimary|clusterPrimary)"$'
            - regex: '^"(endpointTagPrimary|endpointTagSecondary|endpointTagTertiary)"$'
            - regex: '^"(endpointTagMissing|earlier|baseline|recent|later)"$'
            - regex: '^"(releasePrevious|releaseCurrent|releaseHttp|probeHour)"$'
            - regex: '^"(probeLatest|date|latencyLow|latencyHigh|trafficBytes)"$'
            - regex: '^"(availabilityLow|availabilityHigh|availabilityFull)"$'
            - regex: '^"(vlessKind|ssKind|port443|port8443|port9443|port53843|port53844)"$'
            - regex: '^"(activeShortId|serverPskB64|serverPskB64Alternate)"$'
            - regex: '^"(serverPskB64Escaped|userPskB64)"$'
            - regex: '^"(authority53844|authorityAlias|canaryH2c|limitBytes)"$'
            - regex: '^"(usedBytes|remainingBytes)"$'
            - regex: '^"(fiveGiB|tenGiB|elevenGiB|fifteenGiB|fourGiB|oneGiB)"$'
            - regex: '^"(resetSource|credentialEpoch|priorityTierDefault|priorityTierCreated)"$'
            - regex: '^"(rawUri|providerSystemUrl|mihomoMirrorBase|healthSeoulA)"$'
            - regex: '^"(healthShared|healthEndpointNode|healthXpNode|healthSubscribed)"$'
            - regex: '^"(clashLines|providerHost|providerPassword)"$'
            - regex: '^"(dest|server_names|server_names_source|fingerprint|reality_keys)"$'
            - regex: '^"(private_key|public_key|active_short_id|method|server_psk_b64)"$'
            - regex: '^"(policy|day_of_month|tz_offset_minutes)"$'
            - regex: '^"(primaryServerNames|secondaryServerNames|tertiaryServerNames)"$'
            - regex: '^"(loopbackServerNames|primaryAuthorities|tertiaryAuthorities)"$'
            - regex: '^"(existingAuthoritiesPort443|existingAndHost119Port53844)"$'
            - regex: '^"(host119Port53844|host126|host126Port443|host126Port53844)"$'
            - regex: '^"(host130|host130Port443|host130Port8443)"$'
