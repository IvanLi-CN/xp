id: fixture-policy-typescript-assignment-source
language: TypeScript
severity: error
message: Fixture operational field assignments must use a direct fixtureCatalog accessor call.
note: Add a safe synthetic value to fixture-policy/catalog.json and expose it through the adapter.
files:
  - web/src/**/*.test.ts
  - web/src/**/*.spec.ts
  - web/tests/**/*.ts
  - web/src/**/*.stories.ts
  - web/.storybook/mocks/**/*.ts
  - web/src/storybook/**/*.ts
  - web/src/demo/fixtures.ts
rule:
  all:
    - kind: assignment_expression
    - has:
        field: left
        pattern: $OBJECT.$FIELD
    - has:
        field: right
        not:
          any:
            - pattern: fixtureCatalog.$GROUP.$ACCESSOR()
            - pattern: 'null'
    - not:
        all:
          - has:
              field: left
              pattern: $OBJECT.node_id
          - has:
              field: right
              pattern: nodeId
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: setupApiMocks
    - not:
        all:
          - has:
              field: left
              pattern: $OBJECT.subscription_token
          - has:
              field: right
              pattern: nextSubscriptionToken()
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    any:
                      - pattern: handleRequest
                      - pattern: setupApiMocks
    - not:
        all:
          - has:
              field: left
              pattern: $OBJECT.$FIELD
          - has:
              field: right
              regex: '^payload[.](canary_upstream|accepted_authorities)$'
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: handleAdminConfigAndEndpointRoutes
constraints:
  FIELD:
    regex: '^(accessHost|access_host|apiBaseUrl|api_base_url|host|hostname|serverNames|server_names|acceptedAuthorities|accepted_authorities|canaryUpstreamUrl|canary_upstream_url|canary_upstream|nodeId|node_id|nodeName|node_name|endpointId|endpoint_id|endpointTag|endpoint_tag|subscriptionToken|subscription_token|token|secret|password|ip|public_ipv4|selected_public_ip|dest|destination|xray_api_addr|tag|bind|cluster_id|leader_api_base_url|mesh_url|meshBaseUrl|mesh_base_url|publicBaseUrl|public_base_url|publicOrigin|runId|run_id|configHash|config_hash|lastSeenAt|last_seen_at|lastProbeAt|last_probe_at|lastSyncedAt|last_synced_at|lastOkAt|last_ok_at|lastFailAt|last_fail_at|downSince|down_since|lastRestartAt|last_restart_at|lastRestartFailAt|last_restart_fail_at|slotStart|slot_start|observedAt|observed_at|occurredAt|occurred_at|windowStart|window_start|windowEnd|window_end|minute|startMinute|start_minute|endMinute|end_minute|createdAt|created_at|updatedAt|updated_at|checkedAt|checked_at|connectedAt|connected_at|generatedAt|generated_at|lastSampleAt|last_sample_at|lastTransitionAt|last_transition_at|lastConnectionStartedAt|last_connection_started_at|cycleStartAt|cycle_start_at|cycleEndAt|cycle_end_at|trackingSince|tracking_since|latestCheckedAt|latest_checked_at|lastSuccessAt|last_success_at|hour|startedAt|started_at|finishedAt|finished_at|completedAt|completed_at|emittedAt|emitted_at|startAt|start_at|endAt|end_at|windowStartAt|window_start_at|windowEndAt|window_end_at|latencyMs|latency_ms|probeLatencyMs|probe_latency_ms|latency_p50_ms|latency_p95_ms|availability_1h|availability_24h|mesh_availability_24h|connection_generation|current_connection_requests|requests_5m|connection_starts_5m|requests_1h|connection_starts_1h|trafficBytes|traffic_bytes|uplink_bytes|downlink_bytes|totalBytes|total_bytes|requests|connections|throughput)$'
