id: fixture-policy-catalog-string-values
language: Json
severity: error
message: Fixture catalog strings must be approved synthetic values or schema keys.
files:
  - fixture-policy/catalog.json
rule:
  all:
    - kind: string
    - not:
        regex: '^("(hosts|addresses|urls|identifiers|timestamps|metrics|lists|slots|subscription|nodeIds|endpointIds|tags|accessHosts|apiBases|strings|numbers|stringLists|primary|secondary|tertiary|serverPrimary|serverSecondary|primaryIpv4|secondaryIpv4|tertiaryIpv4|loopback|loopback39043|loopback49043|primaryApi|secondaryApi|tertiaryApi|publicOrigin|none|nodePrimary|nodeSecondary|nodeTertiary|nodeNamePrimary|nodeNameSecondary|nodeNameTertiary|endpointPrimary|endpointSecondary|endpointTertiary|userPrimary|userSecondary|userTertiary|userQuaternary|userQuinary|tokenPrimary|tokenSecondary|tokenTertiary|tokenQuaternary|tokenQuinary|clusterPrimary|endpointTagPrimary|endpointTagSecondary|endpointTagTertiary|earlier|baseline|recent|later|latencyLow|latencyHigh|trafficBytes|availabilityLow|availabilityHigh|availabilityFull|primaryServerNames|secondaryServerNames|tertiaryServerNames|primaryAuthorities|tertiaryAuthorities)"|""|"((?:(?:https?|tcp)://)?[A-Za-z0-9-]+[.]fixture[.]test[.]?(:[0-9]{1,5})?|(https?://)?(192[.]0[.]2[.][0-9]{1,3}|198[.]51[.]100[.][0-9]{1,3}|203[.]0[.]113[.][0-9]{1,3}|127[.]0[.]0[.]1)(?::[0-9]{1,5})?|[a-z]+-fixture-[a-z0-9-]+|fixture-[a-z0-9-]+|[a-z]+-tag-fixture-[a-z0-9-]+|(node|endpoint|user|ss|vless|tag|e)([-_][a-z0-9]+)+|(?:n|e)[0-9]|(?:ss|vless|tag-[12])|NODE-A.FIXTURE.TEST[.]|peer-a|n1|n2|n3|sub_[a-z0-9_]+|01K0000000000000000000000[A-E]|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.]0{3})?Z)")$'
