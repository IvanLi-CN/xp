    - not:
        any:
          - regex: '^("(hosts|addresses|urls|identifiers|timestamps|metrics|lists|slots|subscription|nodeIds|endpointIds|tags|accessHosts|apiBases|strings|numbers|stringLists|primary|secondary|tertiary|serverPrimary|serverSecondary|primaryIpv4|secondaryIpv4|tertiaryIpv4|loopback|loopback39043|loopback49043|primaryApi|secondaryApi|tertiaryApi|canaryHttpsListener|canaryHttpsAlternate|canaryHttpLoopback|publicFallback|publicOrigin|none|nodePrimary|nodeSecondary|nodeTertiary|nodeNamePrimary|nodeNameSecondary|nodeNameTertiary|endpointPrimary|endpointSecondary|endpointTertiary|userPrimary|userSecondary|userTertiary|userQuaternary|userQuinary|tokenPrimary|tokenSecondary|tokenTertiary|tokenQuaternary|tokenQuinary|probeRunPrimary|probeRunSecondary|probeConfigPrimary|clusterPrimary|endpointTagPrimary|endpointTagSecondary|endpointTagTertiary|endpointTagMissing|earlier|baseline|recent|later|probeHour|probeLatest|latencyLow|latencyHigh|trafficBytes|availabilityLow|availabilityHigh|availabilityFull|primaryServerNames|secondaryServerNames|tertiaryServerNames|loopbackServerNames|existingAuthoritiesPort443|existingAndHost119Port53844|host119Port53844|host126|host126Port443|host126Port53844|host130|host130Port443|host130Port8443)"|""|"((?:(?:https?|tcp)://)?[A-Za-z0-9-]+[.]fixture[.]test[.]?(:[0-9]{1,5})?|(https?://)?(192[.]0[.]2[.][0-9]{1,3}|198[.]51[.]100[.][0-9]{1,3}|203[.]0[.]113[.][0-9]{1,3}|127[.]0[.]0[.]1)(?::[0-9]{1,5})?|[a-z]+-fixture-[a-z0-9-]+|fixture-[a-z0-9-]+|[a-z]+-tag-fixture-[a-z0-9-]+|(node|endpoint|user|ss|vless|tag|e)([-_][a-z0-9]+)+|(?:n|e)[0-9]|(?:ss|vless|tag-[12])|NODE-A.FIXTURE.TEST[.]|peer-a|n1|n2|n3|sub_[a-z0-9_]+|01K0000000000000000000000[A-E]|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.]0{3})?Z|hinet|keep|drop|Tokyo|extra-node|remote-a|nodebeta|node-unreachable|node-remote|tcp-node|target|sender|Aardvark|Alpha|Beta|Dash Host|Dot Host|Japan|Node Beta|Only US|Osaka A|Osaka B|Seoul A|Singapore A|Tokyo A|Tokyo B|Tokyo-A|hkl|mystery|relay-Japan|sin