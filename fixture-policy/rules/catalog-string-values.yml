          - regex: '^"(?:https?://)?127[.]0[.]0[.]1(?::[0-9]+)?(?:[?][a-z_]+=[a-z0-9_-]+)?"$'
          - regex: '^"(?:192[.]0[.]2|198[.]51[.]100|203[.]0[.]113)[.][0-9]{1,3}(?::[0-9]+)?"$'
          - regex: '^"127[.]0[.]0[.]1(?::[0-9]+)?"$'
