          - regex: '^"(manual|chrome|monthly|user|p2|p3|h2c|hinet|keep|drop|hkl|mystery)"$'
          - regex: '^"(peer-a|extra-node|remote-a|nodebeta|node-unreachable|node-remote)"$'
          - regex: '^"(tcp-node|target|sender|relay-Japan|singapore-a|tokyo-a)"$'
          - regex: '^"(Aardvark|Alpha|Beta|Dash Host|Dot Host|Japan|Node Beta)"$'
          - regex: '^"(Only US|Osaka A|Osaka B|Seoul A|Singapore A|Tokyo|Tokyo A)"$'
          - regex: '^"(Tokyo B|Tokyo-A|vless_reality_vision_tcp|ss2022_2022_blake3_aes_128_gcm)"$'
          - regex: '^"(AAAAAAAAAAAAAAAAAAAAAA==|BBBBBBBBBBBBBBBBBBBBBB==)"$'
          - regex: '^"AQEBAQEBAQEBAQEBAQEBAQ=="$'
          - regex: '^"[+]/v7[+]/v7[+]/v7[+]/v7[+]/v7[+]w=="$'
          - regex: '^"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"$'
          - regex: '^"0123456789abcdef"$'
          - regex: '^"NODE-A[.]FIXTURE[.]TEST[.]"$'
          - regex: '^"(proxies:|  - name: demo|    type: vless)"$'
          - regex: '^"(    servername: edge-a.fixture.test|    reality-opts:)"$'
          - regex: '^"      public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"$'
