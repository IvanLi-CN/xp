id: fixture-policy-tsx-endpoint-kind
language: Tsx
severity: error
message: Fixture endpoint kinds must use a catalog accessor.
note: Use fixtureCatalog.endpoint.vlessKind() or fixtureCatalog.endpoint.ssKind().
files:
  - web/src/**/*.test.tsx
  - web/src/**/*.spec.tsx
  - web/tests/**/*.tsx
  - web/src/**/*.stories.tsx
  - web/.storybook/mocks/**/*.tsx
  - web/src/storybook/**/*.tsx
rule:
  all:
    - kind: pair
    - has:
        field: key
        any:
          - regex: '^kind$'
          - pattern: '["kind"]'
    - inside:
        stopBy: end
        all:
          - kind: object
          - has:
              kind: pair
              has:
                field: key
                any:
                  - regex: '^(endpoint_id|endpointId|port)$'
                  - pattern: '["endpoint_id"]'
                  - pattern: '["endpointId"]'
                  - pattern: '["port"]'
    - has:
        field: value
        not:
          any:
            - pattern: fixtureCatalog.endpoint.vlessKind()
            - pattern: fixtureCatalog.endpoint.ssKind()
            - all:
                - pattern: seed.kind
                - inside:
                    stopBy: end
                    all:
                      - kind: function_declaration
                      - has:
                          field: name
                          pattern: ensureEndpointRecord
            - pattern: >-
                $CONDITION ? fixtureCatalog.endpoint.ssKind() : fixtureCatalog.endpoint.vlessKind()
