id: fixture-policy-rust-json-fixture-literal
language: Rust
severity: error
message: Rust JSON fixture macros must not embed operational literals.
note: Use a direct xp_test_fixtures accessor instead.
files:
  - tests/**/*.rs
  - src/**/*_tests.rs
  - src/**/tests.rs
  - src/**/tests/**/*.rs
  - src/**/test_fixtures.rs
rule:
  all:
    - kind: macro_invocation
    - any:
        - regex: >-
            (?xs) ^.*json\s*!\s*\(.*
            "(dest|server_names|public_domain|server_name|hostname|service|origin_url)"\s*:
            \s*(\[?\s*)?"
        - regex: >-
            (?xs) ^.*json\s*!\s*\(.*
            "(private_key|public_key|short_ids|active_short_id)"\s*:
            \s*(\[?\s*)?"
        - regex: >-
            (?xs) ^.*json\s*!\s*\(.*
            "(server_psk_b64|user_psk_b64|password)"\s*:
            \s*(\[?\s*)?"
        - regex: >-
            (?xs) ^.*json\s*!\s*\(.*
            "(dest|server_names|public_domain|server_name|hostname|service|origin_url)"\s*:
            \s*(?:(?:[\[{]\s*)|
            (?:[A-Za-z_][A-Za-z0-9_:]*!?\s*(?:\([^)]*?|\[)))*
            (?:std::|serde_json::from_|request|payload|body)
        - regex: >-
            (?xs) ^.*json\s*!\(.*
            "(private_key|public_key|short_ids|active_short_id)"\s*:
            \s*(?:(?:[\[{]\s*)|
            (?:[A-Za-z_][A-Za-z0-9_:]*!?\s*(?:\([^)]*?|\[)))*
            (?:std::|serde_json::from_|request|payload|body)
        - regex: >-
            (?xs) ^.*json\s*!\(.*
            "(server_psk_b64|user_psk_b64|password)"\s*:
            \s*(?:(?:[\[{]\s*)|
            (?:[A-Za-z_][A-Za-z0-9_:]*!?\s*(?:\([^)]*?|\[)))*
            (?:std::|serde_json::from_|request|payload|body)
        - all:
            - regex: >-
                (?xs) ^.*json\s*!\s*\(.*
                "published_at"\s*:
            - not:
                regex: >-
                  (?xs) "published_at"\s*:
                  \s*xp_test_fixtures::release_[A-Za-z0-9_]+\(\)
        - all:
            - regex: >-
                (?xs) ^.*json\s*!\s*\(.*
                "browser_download_url"\s*:
            - not:
                regex: >-
                  (?xs) "browser_download_url"\s*:
                  \s*(?:format!\(.*?server\.uri\(\).*?\)|xp_url|xp_ops_url|checksums_url)
