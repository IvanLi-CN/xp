id: fixture-policy-typescript-subscription-token-factory
language: TypeScript
severity: error
message: Subscription token factories must come directly from fixtureCatalog.
note: Use the approved fixtureCatalog factory.
files:
  - web/src/**/*.test.ts
  - web/src/**/*.spec.ts
  - web/tests/**/*.ts
  - web/src/**/*.stories.ts
  - web/.storybook/mocks/**/*.ts
  - web/src/storybook/**/*.ts
  - web/src/demo/fixtures.ts
rule:
  any:
    - all:
        - kind: variable_declarator
        - has:
            field: name
            pattern: nextSubscriptionToken
        - has:
            field: value
            not:
              pattern: fixtureCatalog.identifier.createSubscriptionTokenFactory()
    - all:
        - kind: assignment_expression
        - has:
            field: left
            pattern: nextSubscriptionToken
        - has:
            field: right
            not:
              pattern: fixtureCatalog.identifier.createSubscriptionTokenFactory()
    - all:
        - kind: function_declaration
        - has:
            field: parameters
            has:
              all:
                - kind: required_parameter
                - has:
                    field: pattern
                    pattern: nextSubscriptionToken
        - not:
            has:
              field: name
              pattern: handleRequest
    - all:
        - kind: call_expression
        - pattern: handleRequest($STATE, $REQUEST, $TOKEN)
        - not:
            pattern: handleRequest($STATE, $REQUEST, nextSubscriptionToken)
