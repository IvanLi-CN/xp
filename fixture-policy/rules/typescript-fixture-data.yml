id: fixture-policy-typescript-data-source
language: TypeScript
severity: error
message: Fixture operational data must be a direct fixtureCatalog accessor call.
note: Add a safe synthetic value to fixture-policy/catalog.json and expose it through the adapter.
files:
  - web/src/**/*.test.ts
  - web/src/**/*.spec.ts
  - web/tests/**/*.ts
  - web/src/**/*.stories.ts
  - web/.storybook/mocks/**/*.ts
  - web/src/storybook/**/*.ts
  - web/src/demo/fixtures.ts
rule:
  all:
    - kind: pair
    - has:
        field: key
        any:
          - regex: '^(accessHost|access_host|apiBaseUrl|api_base_url|host|hostname|serverNames|server_names|acceptedAuthorities|accepted_authorities|canaryUpstreamUrl|canary_upstream_url|canary_upstream|nodeId|node_id|nodeName|node_name|endpointId|endpoint_id|endpointTag|endpoint_tag|subscriptionToken|subscription_token|token|secret|password|lastSeenAt|last_seen_at|lastProbeAt|last_probe_at|last_synced_at|last_ok_at|last_fail_at|down_since|last_restart_at|last_restart_fail_at|slot_start|observed_at|occurred_at|window_start|window_end|minute|start_minute|end_minute|createdAt|created_at|updatedAt|updated_at|checkedAt|checked_at|connectedAt|connected_at|latencyMs|latency_ms|probeLatencyMs|probe_latency_ms|requests|connections|throughput|ip|public_ipv4|selected_public_ip|dest|destination|xray_api_addr|tag|bind|cluster_id|leader_api_base_url|mesh_url|generated_at|last_sample_at|last_transition_at|last_connection_started_at|latency_p50_ms|latency_p95_ms|availability_1h|availability_24h|mesh_availability_24h|connection_generation|current_connection_requests|requests_5m|connection_starts_5m|requests_1h|connection_starts_1h|publicOrigin)$'
          - regex: '^(trafficBytes|traffic_bytes|uplink_bytes|downlink_bytes|total_bytes)$'
          - regex: '^(startedAt|started_at|finishedAt|finished_at)$'
          - regex: '^(completedAt|completed_at|emittedAt|emitted_at)$'
          - regex: '^(startAt|start_at|endAt|end_at)$'
          - regex: '^(windowStartAt|window_start_at)$'
          - regex: '^(windowEndAt|window_end_at|cycleStartAt|cycle_start_at)$'
          - regex: '^(cycleEndAt|cycle_end_at|trackingSince|tracking_since)$'
    - has:
        field: value
        not:
          any:
            - pattern: fixtureCatalog.$GROUP.$ACCESSOR()
            - pattern: 'null'
    - not:
        all:
          - has:
              field: value
              any:
                - pattern: endpoint.endpoint_id
                - pattern: endpoint.node_id
          - inside:
              stopBy: end
              pattern: |
                ($ENDPOINT_ID) => {
                  const endpoint = endpointById.get($ENDPOINT_ID);
                  if (!endpoint) throw new Error($ERROR);
                  return { $$$ };
                }
    - not:
        all:
          - has:
              field: value
              any:
                - regex: '^`\$\{derived\[0\]\}:443`$'
                - pattern: derived
                - pattern: '[$NODE.access_host.replace($$$)]'
                - pattern: 'payload.canary_upstream ? { $$$ } : undefined'
                - pattern: acceptedAuthorities
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: buildEndpointCreateMeta
    - not:
        all:
          - has:
              field: value
              any:
                - pattern: node.node_id
                - pattern: node.node_name
                - pattern: node.api_base_url
                - pattern: node.access_host
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    regex: '^(buildNodeRuntimeListItem|buildNodeHistory|buildDefaultUserTraffic)$'
    - not:
        all:
          - has:
              field: value
              any:
                - regex: '^`\$\{derived\[0\]\}:443`$'
                - pattern: derived
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: refreshGlobalEndpointReality
    - not:
        all:
          - has:
              field: value
              any:
                - pattern: endpoint.endpoint_id
                - pattern: endpoint.node_id
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: applyAutoAssignForEndpoint
    - not:
        all:
          - has:
              field: value
              any:
                - pattern: payload.node_name ?? node.node_name
                - pattern: payload.access_host ?? node.access_host
                - pattern: payload.api_base_url ?? node.api_base_url
                - pattern: endpointId
                - pattern: payload.node_id
                - pattern: tag
                - pattern: nodeId
                - pattern: endpoint.endpoint_id
                - pattern: endpoint.tag
                - pattern: item.node_id
                - pattern: q.node_id
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: handleRequest
    - not:
        all:
          - has:
              field: value
              pattern: nodeId
          - has:
              field: key
              regex: '^node_id$'
          - inside:
              stopBy: end
              all:
                - kind: function_declaration
                - has:
                    field: name
                    pattern: setupApiMocks
