id: fixture-policy-typescript-data-source
language: TypeScript
severity: error
message: Fixture operational data must be a direct fixtureCatalog accessor call.
note: Add a safe synthetic value to fixture-policy/catalog.json and expose it through the adapter.
files:
  - web/src/**/*.test.ts
  - web/src/**/*.spec.ts
  - web/tests/**/*.ts
  - web/src/**/*.stories.ts
  - web/.storybook/mocks/**/*.ts
  - web/src/storybook/**/*.ts
  - web/src/demo/fixtures.ts
rule:
  all:
    - kind: pair
    - has:
        field: key
        regex: '^(accessHost|access_host|apiBaseUrl|api_base_url|host|hostname|serverNames|server_names|acceptedAuthorities|accepted_authorities|canaryUpstreamUrl|canary_upstream_url|canary_upstream|nodeId|node_id|nodeName|node_name|endpointId|endpoint_id|endpointTag|endpoint_tag|subscriptionToken|subscription_token|token|secret|password|lastSeenAt|last_seen_at|lastProbeAt|last_probe_at|last_synced_at|last_ok_at|last_fail_at|down_since|last_restart_at|last_restart_fail_at|slot_start|observed_at|occurred_at|window_start|window_end|minute|start_minute|end_minute|createdAt|created_at|updatedAt|updated_at|checkedAt|checked_at|connectedAt|connected_at|latencyMs|latency_ms|probeLatencyMs|probe_latency_ms|trafficBytes|traffic_bytes|uplink_bytes|downlink_bytes|requests|connections|throughput|ip|public_ipv4|selected_public_ip|dest|destination|xray_api_addr|tag|bind|cluster_id|leader_api_base_url|mesh_url|generated_at|last_sample_at|last_transition_at|latency_p50_ms|latency_p95_ms|availability_1h|availability_24h|mesh_availability_24h|publicOrigin)$'
    - has:
        field: value
        not:
          pattern: fixtureCatalog.$GROUP.$ACCESSOR()
    - not:
        all:
          - has:
              field: value
              any:
                - pattern: endpoint.endpoint_id
                - pattern: endpoint.node_id
          - inside:
              stopBy: end
              pattern: |
                ($ENDPOINT_ID) => {
                  const endpoint = endpointById.get($ENDPOINT_ID);
                  if (!endpoint) throw new Error($ERROR);
                  return { $$$ };
                }
