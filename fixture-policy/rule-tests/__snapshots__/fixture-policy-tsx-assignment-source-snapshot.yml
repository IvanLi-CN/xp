id: fixture-policy-tsx-assignment-source
snapshots:
  ? |
    report.last_synced_at = new Date().toISOString();
  : labels:
    - source: report.last_synced_at = new Date().toISOString()
      style: primary
      start: 0
      end: 48
    - source: report.last_synced_at
      style: secondary
      start: 0
      end: 21
    - source: new Date().toISOString()
      style: secondary
      start: 24
      end: 48
  ? |
    report.start_at = "unapproved-timestamp";
  : labels:
    - source: report.start_at = "unapproved-timestamp"
      style: primary
      start: 0
      end: 40
    - source: report.start_at
      style: secondary
      start: 0
      end: 15
    - source: '"unapproved-timestamp"'
      style: secondary
      start: 18
      end: 40
