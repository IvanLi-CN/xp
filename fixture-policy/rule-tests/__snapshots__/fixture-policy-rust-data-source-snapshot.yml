id: fixture-policy-rust-data-source
snapshots:
  ? |
    let fixture = Config { api_base_url: "http://127.0.0.2:9".to_string() };
  : labels:
    - source: 'api_base_url: "http://127.0.0.2:9".to_string()'
      style: primary
      start: 23
      end: 69
    - source: api_base_url
      style: secondary
      start: 23
      end: 35
  ? |
    let fixture = Config { dest: format!("host.docker.internal:443") };
  : labels:
    - source: 'dest: format!("host.docker.internal:443")'
      style: primary
      start: 23
      end: 64
    - source: dest
      style: secondary
      start: 23
      end: 27
  ? |
    let fixture = Config { node_id: "node-unapproved" };
  : labels:
    - source: 'node_id: "node-unapproved"'
      style: primary
      start: 23
      end: 49
    - source: node_id
      style: secondary
      start: 23
      end: 30
  ? |
    let fixture = Config { public_ipv4: format!("192.0.2.{}", index) };
  : labels:
    - source: 'public_ipv4: format!("192.0.2.{}", index)'
      style: primary
      start: 23
      end: 64
    - source: public_ipv4
      style: secondary
      start: 23
      end: 34
  ? |
    let fixture = Config { timestamp: std::env::var("TEST_TIMESTAMP").unwrap() };
  : labels:
    - source: 'timestamp: std::env::var("TEST_TIMESTAMP").unwrap()'
      style: primary
      start: 23
      end: 74
    - source: timestamp
      style: secondary
      start: 23
      end: 32
