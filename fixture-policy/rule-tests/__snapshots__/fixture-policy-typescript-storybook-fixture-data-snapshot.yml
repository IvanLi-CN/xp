id: fixture-policy-typescript-storybook-fixture-data
snapshots:
  ? |
    const item = { access_host: "live.example" };
  : labels:
    - source: 'access_host: "live.example"'
      style: primary
      start: 15
      end: 42
    - source: access_host
      style: secondary
      start: 15
      end: 26
    - source: '"live.example"'
      style: secondary
      start: 28
      end: 42
  ? |
    const item = { minute: new Date().toISOString() };
  : labels:
    - source: 'minute: new Date().toISOString()'
      style: primary
      start: 15
      end: 47
    - source: minute
      style: secondary
      start: 15
      end: 21
    - source: new Date().toISOString()
      style: secondary
      start: 23
      end: 47
  ? |
    const item = { token: process.env.LIVE_TOKEN };
  : labels:
    - source: 'token: process.env.LIVE_TOKEN'
      style: primary
      start: 15
      end: 44
    - source: token
      style: secondary
      start: 15
      end: 20
    - source: process.env.LIVE_TOKEN
      style: secondary
      start: 22
      end: 44
