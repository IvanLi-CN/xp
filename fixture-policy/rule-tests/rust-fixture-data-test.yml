id: fixture-policy-rust-data-source
valid:
  - |
    let fixture = Config { node_id: xp_test_fixtures::primary_node_id() };
  - |
    let call = Call::AddInbound { tag: request.tag.clone() };
  - |
    let request = ReconcileRequest::RemoveInbound { tag: observed_tag.clone() };
  - |
    let request = RemoveInboundRequest { tag: observed_tag.clone() };
  - |
    let state = PeerServerState {
      cluster_id: cluster.cluster_id.clone(),
      requests: requests.clone(),
    };
  - |
    let node = Node {
      node_id: target.node_id.clone(),
      access_host: target.access_host.clone(),
      api_base_url: "http://127.0.0.1:9".to_string(),
    };
  - |
    let endpoint = Endpoint {
      endpoint_id: xp::id::new_ulid_string(),
      node_id: target.node_id.clone(),
      tag: format!("vless-mesh-resource-{index:02}"),
    };
  - |
    let reality = RealityConfig {
      dest: format!("host.docker.internal:{}", canary.addr.port()),
    };
  - |
    let target = MeshPeerTarget {
      mesh_base_url: Some(format!(
        "https://{}:{}",
        xp_test_fixtures::loopback_address(),
        proxy.addr.port(),
      )),
      public_base_url: xp_test_fixtures::public_fallback_url().to_owned(),
    };
  - |
    let target = MeshPeerTarget {
      mesh_base_url: Some(format!("https://{addr}")),
      public_base_url: format!("http://{}", server.addr),
    };
  - |
    let request = xp::xray::proto::xray::app::proxyman::command::RemoveInboundRequest {
      tag: endpoint.tag,
    };
  - |
    let init = StoreInit {
      bootstrap_node_id: None,
      bootstrap_node_name: config.node_name.clone(),
      bootstrap_access_host: config.access_host.clone(),
      bootstrap_api_base_url: config.api_base_url.clone(),
    };
invalid:
