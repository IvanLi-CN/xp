id: fixture-policy-tsx-catalog-origin
valid:
  - |
    import { fixtureCatalog } from "../fixture-policy/catalog";
invalid:
  - |
    function fixtureCatalog() { return {}; }
  - |
    import * as fixtureCatalog from "./fixture-input";
  - |
    import fixtureCatalog from "./fixture-input";
  - |
    const build = (fixtureCatalog: unknown) => fixtureCatalog;
  - |
    try { work(); } catch (fixtureCatalog) { consume(fixtureCatalog); }
  - |
    class fixtureCatalog {}
  - |
    const { fixtureCatalog } = source;
  - |
    const { source: fixtureCatalog } = source;
