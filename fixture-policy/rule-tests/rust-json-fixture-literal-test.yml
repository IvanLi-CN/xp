id: fixture-policy-rust-json-fixture-literal
valid:
  - |
    let meta = serde_json::json!({
      "reality": xp_test_fixtures::endpoint_vless_meta(),
    });
  - |
    let meta = json!({
      "dest": xp_test_fixtures::endpoint_authority_53844(),
    });
  - |
    let release = json!({
      "published_at": xp_test_fixtures::release_current_timestamp(),
    });
invalid:
  - |
    let meta = json!({
      "reality": { "dest": "live.example:443" }
    });
  - |
    let meta = serde_json::json!({
      "reality": {"dest": "live.example:443", "server_names": ["live.example"]}
    });
  - |
    let meta = serde_json::json!({
      "reality": { "dest": "node.fixture.test:443" },
      "reality_keys": { "private_key": "private" },
      "short_ids": ["0123456789abcdef"]
    });
  - |
    let meta = json!({
      "reality": { "dest": request.destination }
    });
  - |
    let release = json!({
      "published_at": "2026-01-20T00:00:00Z"
    });
  - |
    let release = json!({
      "browser_download_url": std::env::var("LIVE_URL")
    });
  - |
    let published_at = "2026-01-20T00:00:00Z";
    let release = json!({
      "published_at": published_at
    });
  - |
    let release = json!({
      "published_at": format!("{}", "2026-01-20T00:00:00Z")
    });
  - |
    let release = json!({
      "browser_download_url": "https://github.com/live/download"
    });
  - |
    let release = json ! ({
      "published_at": "2026-01-20T00:00:00Z"
    });
