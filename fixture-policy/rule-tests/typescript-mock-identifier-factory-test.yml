    const nextEndpointId = () => process.env.ENDPOINT_ID;
  - |
    const nextEndpointTag = () => `tag-${counter}`;
  - |
    const nextUserId = () => userId;
  - |
    const nextEndpointId = fixtureCatalog.identifier.createEndpointIdFactory();
