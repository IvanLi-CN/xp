id: fixture-policy-tsx-assignment-source
valid:
  - |
    report.start_at = fixtureCatalog.timestamp.baseline();
invalid:
  - |
    report.start_at = "unapproved-timestamp";
  - |
    report.last_synced_at = new Date().toISOString();
  - |
    report.config_hash = "unapproved-config";
  - |
    report.hour = new Date().toISOString();
