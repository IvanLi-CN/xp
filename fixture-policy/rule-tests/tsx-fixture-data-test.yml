id: fixture-policy-tsx-data-source
valid:
  - |
    const fixture = { host: fixtureCatalog.host.primary() };
  - |
    const fixture = { start_at: fixtureCatalog.timestamp.baseline() };
invalid:
  - |
    const fixture = { host: "unapproved.fixture.test" };
  - |
    const fixture = { node_name: "unapproved-node" };
  - |
    const fixture = { end_at: new Date().toISOString() };
  - |
    const fixture = { total_bytes: 4096 };
  - |
    const fixture = { last_synced_at: new Date().toISOString() };
  - |
    const fixture = { window_end: process.env.TEST_WINDOW_END };
