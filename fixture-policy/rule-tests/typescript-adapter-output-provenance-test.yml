id: fixture-policy-typescript-adapter-output-provenance
valid:
  - |
    function createSubscriptionTokenFactory() {
      let subscriptionTokenIndex = 0;
      let demoTokenIndex = 0;
      return (namespace?: "demo") => {
        if (namespace === "demo") {
          demoTokenIndex += 1;
          return `${catalog.identifiers.tokenPrimary}-demo-${demoTokenIndex}`;
        }
        const token = catalog.subscription.tokens[subscriptionTokenIndex];
        if (!token) {
          throw new Error("synthetic subscription token catalog exhausted");
        }
        subscriptionTokenIndex += 1;
        return token;
      };
    }
  - |
    function createUserIdFactory() {
      let userIdIndex = 0;
      let demoUserIndex = 0;
      const userIds = [
        catalog.identifiers.userTertiary,
        catalog.identifiers.userQuaternary,
        catalog.identifiers.userQuinary,
      ];
      return (namespace?: "demo") => {
        if (namespace === "demo") {
          demoUserIndex += 1;
          return `${catalog.identifiers.userPrimary}-demo-${demoUserIndex}`;
        }
        const userId = userIds[userIdIndex];
        if (!userId) {
          throw new Error("synthetic user ID catalog exhausted");
        }
        userIdIndex += 1;
        return userId;
      };
    }
  - |
    function createStringAccessors<Values extends Record<string, string>>(
      values: Values,
    ) {
      return Object.fromEntries(
        Object.entries(values).map(([name, value]) => [name, () => value]),
      ) as StringAccessors<Values>;
    }
  - |
    function createSubscriptionTokenFactory() {
      let subscriptionTokenIndex = 0;
      return () => {
        const token = catalog.subscription.tokens[subscriptionTokenIndex];
        if (!token) {
          throw new Error("synthetic subscription token catalog exhausted");
        }
        subscriptionTokenIndex += 1;
        return token;
      };
    }
  - |
    function createEndpointIdFactory() {
      let endpointIdIndex = 0;
      const endpointIds = Object.values(catalog.fixtures.strings.endpointId);
      return () => {
        const endpointId = endpointIds[endpointIdIndex];
        if (!endpointId) {
          throw new Error("synthetic endpoint ID catalog exhausted");
        }
        endpointIdIndex += 1;
        return endpointId;
      };
    }
  - |
    function nextMeshPeerNodeId() {
      const nodeId = meshPeerNodeIds[meshPeerNodeIdIndex % meshPeerNodeIds.length];
      meshPeerNodeIdIndex += 1;
      return nodeId;
    }
  - |
    const primary = () => catalog.hosts.primary;
  - |
    const absent = () => null;
  - |
    const createSubscriptionTokenFactoryAccessor = () => createSubscriptionTokenFactory();
  - |
    const clash = () => catalog.operations.subscription.clashLines.join("\n");
  - |
    function nextSubscriptionToken() {
      const token = catalog.subscription.tokens[nextSubscriptionTokenIndex];
      if (!token) {
        throw new Error("synthetic subscription token catalog exhausted");
      }
      nextSubscriptionTokenIndex += 1;
      return token;
    }
