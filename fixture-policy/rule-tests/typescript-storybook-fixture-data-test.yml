id: fixture-policy-typescript-storybook-fixture-data
valid:
  - 'const item = { access_host: fixtureCatalog.host.primary() };'
  - 'const item = { minute: minuteFromOffset(start, 1) };'
invalid:
  - |
    const item = { access_host: "live.example" };
  - |
    const item = { node_name: "unapproved-node" };
  - |
    const unsafe = "live.example";
    const item = { node_id: unsafe };
