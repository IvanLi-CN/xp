name: ci-performance

on:
  pull_request:
    paths:
      - Dockerfile
      - build.rs
      - .xp-source-marker
      - Cargo.toml
      - Cargo.lock
      - src/**
      - proto/**
      - web/**
      - tests/**
      - scripts/**
      - .bun-version
      - bun.lock
      - package.json
      - dprint.json
      - '**/*.md'
      - rustfmt.toml
      - rust-toolchain.toml
      - fixture-policy/**
      - test-fixtures/**
      - .dockerignore
      - edgeone.json
      - .github/scripts/performance_assert.py
      - .github/scripts/normalize-cargo-input-timestamps.sh
      - .github/scripts/run-rust-tests.sh
      - scripts/cargo-cache/test.sh
      - scripts/update-web-dist-fingerprint.sh
      - .github/scripts/test-ci-performance.py
      - .github/scripts/write-cache-receipt.sh
      - .github/workflows/ci.yml
      - .github/workflows/ci-performance.yml
      - .github/workflows/ci-performance-sample.yml
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string

      proxy_profile:
        description: Optional proxy runtime benchmark (independent of CI build benchmark)
        type: choice
        options: [none, light, full]
        default: none

concurrency:
  group: >-
    ci-performance-${{ github.event.pull_request.number || format('manual-{0}',
    github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

jobs:
  proxy-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.proxy_profile != 'none'
    uses: ./.github/workflows/xp-proxy-perf.yml
    with:
      profile: ${{ inputs.proxy_profile }}
      candidate_sha: ${{ inputs.target_sha }}
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.proxy_profile == 'none'
    runs-on: ubuntu-latest
    steps:
      - run: |
          target_sha="${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" ]]; then
            test "${{ github.event.pull_request.head.sha }}" = "${target_sha}"
          else
            test "${{ inputs.target_sha }}" = "${target_sha}"
            test "${{ github.workflow_sha }}" = "${target_sha}"
          fi

  sample:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: {sample: ["1", "2", "3"]}
    name: sample-${{ matrix.sample }}
    uses: ./.github/workflows/ci-performance-sample.yml
    with:
      target_sha: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
      sample: ${{ matrix.sample }}

  assert:
    needs: sample
    if: ${{ always() && !cancelled() && needs.sample.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "cache-receipt-*", path: cache-receipts}
      - name: collect performance metadata
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          jobs_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          artifacts_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/"
          artifacts_url+="artifacts?per_page=100"
          caches_url="repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100"
          # The separate manual proxy profile has no runner time on build samples.
          gh api --paginate "${jobs_url}" | jq -s '
            if all(.[]; .jobs | type == "array") then
              {jobs: [.[].jobs[] | select(.name != "proxy-runtime" or .conclusion != "skipped")]}
            else error("jobs page shape") end
          ' > jobs.json
          gh api --paginate "${artifacts_url}" \
            | jq -s '
                if all(.[]; .artifacts | type == "array")
                then {artifacts: [.[].artifacts[]]}
                else error("artifacts page shape") end
              ' > artifacts.json
          gh api --paginate "${caches_url}" \
            | jq -s '
                if all(.[]; .actions_caches | type == "array")
                then {caches: [.[].actions_caches[]]}
                else error("caches page shape") end
              ' > caches.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > run.json
      - name: assert performance
        run: |
          target_sha="${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}"
          python3 .github/scripts/performance_assert.py \
            --kind ci --jobs jobs.json --run run.json \
            --target-sha "${target_sha}" \
            --receipts cache-receipts \
            --artifacts artifacts.json --caches caches.json \
            --output ci-performance.json
      - name: write summary
        run: |
          {
            echo '### CI performance acceptance'
            echo '```json'
            cat ci-performance.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: "ci-performance-${{ github.run_id }}"
          path: ci-performance.json
          if-no-files-found: ignore

  release-caches:
    # Performance caches are keyed by run+attempt+sample and are never reusable. Leaving them
    # resident evicts the resource-evidence build cache, which turns every evidence run into a
    # full cold compile. Deletion runs last so the assertion job can still read the entries.
    needs: [assert]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: delete this run's performance caches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          scope="perf-${{ github.run_id }}-${{ github.run_attempt }}"
          deleted=0
          while read -r cache_id key; do
            [[ -n "${cache_id}" ]] || continue
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"; then
              deleted=$((deleted + 1))
            else
              echo "::warning::failed to delete cache ${key} (${cache_id})"
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
              | jq -r --arg scope "${scope}" \
                '.actions_caches[] | select(.key | contains($scope)) | "\(.id) \(.key)"'
          )
          echo "deleted ${deleted} performance cache entries for ${scope}"
