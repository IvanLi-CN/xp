name: ci-performance

on:
  pull_request:
    paths:
      - Dockerfile
      - build.rs
      - .xp-source-marker
      - Cargo.toml
      - Cargo.lock
      - src/**
      - proto/**
      - web/**
      - tests/**
      - scripts/**
      - .bun-version
      - bun.lock
      - package.json
      - dprint.json
      - '**/*.md'
      - rustfmt.toml
      - rust-toolchain.toml
      - fixture-policy/**
      - test-fixtures/**
      - .dockerignore
      - edgeone.json
      - .github/scripts/performance_assert.py
      - .github/scripts/normalize-cargo-input-timestamps.sh
      - .github/scripts/run-rust-tests.sh
      - scripts/cargo-cache/test.sh
      - scripts/update-web-dist-fingerprint.sh
      - .github/scripts/test-ci-performance.py
      - .github/scripts/write-cache-receipt.sh
      - .github/workflows/ci.yml
      - .github/workflows/ci-performance.yml
      - .github/workflows/ci-performance-sample.yml
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string

      proxy_profile:
        description: Optional proxy runtime benchmark (independent of CI build benchmark)
        type: choice
        options: [none, light, full, diagnose]
        default: none

concurrency:
  group: >-
    ci-performance-${{ github.event.pull_request.number || format('manual-{0}',
    github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

jobs:
  proxy-runtime:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.proxy_profile != 'none'
      && inputs.proxy_profile != 'diagnose'
    uses: ./.github/workflows/xp-proxy-perf.yml
    with:
      profile: ${{ inputs.proxy_profile }}
      candidate_sha: ${{ inputs.target_sha }}
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.proxy_profile == 'none'
    runs-on: ubuntu-latest
    steps:
      - run: |
          target_sha="${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" ]]; then
            test "${{ github.event.pull_request.head.sha }}" = "${target_sha}"
          else
            test "${{ inputs.target_sha }}" = "${target_sha}"
            test "${{ github.workflow_sha }}" = "${target_sha}"
          fi

  sample:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: {sample: ["1", "2", "3"]}
    name: sample-${{ matrix.sample }}
    uses: ./.github/workflows/ci-performance-sample.yml
    with:
      target_sha: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
      sample: ${{ matrix.sample }}

  assert:
    needs: sample
    if: ${{ always() && !cancelled() && needs.sample.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "cache-receipt-*", path: cache-receipts}
      - name: collect performance metadata
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          jobs_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          artifacts_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/"
          artifacts_url+="artifacts?per_page=100"
          caches_url="repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100"
          gh api --paginate "${jobs_url}" | jq -s '
            if all(.[]; .jobs | type == "array") then {jobs: map(.jobs[])}
            else error("jobs page shape") end
          ' > jobs.json
          gh api --paginate "${artifacts_url}" \
            | jq -s '
                if all(.[]; .artifacts | type == "array")
                then {artifacts: [.[].artifacts[]]}
                else error("artifacts page shape") end
              ' > artifacts.json
          gh api --paginate "${caches_url}" \
            | jq -s '
                if all(.[]; .actions_caches | type == "array")
                then {caches: [.[].actions_caches[]]}
                else error("caches page shape") end
              ' > caches.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > run.json
      - name: assert performance
        run: |
          target_sha="${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}"
          python3 .github/scripts/performance_assert.py \
            --kind ci --jobs jobs.json --run run.json \
            --target-sha "${target_sha}" \
            --receipts cache-receipts \
            --artifacts artifacts.json --caches caches.json \
            --output ci-performance.json
      - name: write summary
        run: |
          {
            echo '### CI performance acceptance'
            echo '```json'
            cat ci-performance.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: "ci-performance-${{ github.run_id }}"
          path: ci-performance.json
          if-no-files-found: ignore

  diagnose-main-transport:
    if: github.event_name == 'workflow_dispatch' && inputs.proxy_profile == 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: tools}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: 093b6fc3b00d5cc7ee6630962fb9c92e7c30b027, path: source}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: {toolchain: 1.96.0, targets: x86_64-unknown-linux-musl}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: transport-diagnose-093b6fc3
          restore-keys: xp-proxy-perf-musl-1.96-main-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14318757764'
          merge-multiple: true
          run-id: 44063124801
          github-token: ${{ github.token }}
          path: fixture
      - name: Prepare immutable fixtures
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release download v3.48.15 --repo "$GITHUB_REPOSITORY" \
            --pattern xray-linux-x86_64 --dir fixture
          expected=b5ac5650fb8ae16371562eef8227625f35b3bf6b4b4c9cd103da0f7a362e8d1a
          printf '%s  %s\n' "$expected" fixture/perf_harness | sha256sum -c
          expected=ba15b5b3658d3b89008d601e730859d06a5db3691320f0130fd91a37bc63412d
          printf '%s  %s\n' "$expected" fixture/xray-linux-x86_64 | sha256sum -c
          chmod +x fixture/*
      - name: Baseline and single-variable TCP_NODELAY comparison
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '4'
          PROBE_TOOLS: ${{ github.workspace }}/tools
          PROBE_HARNESS: ${{ github.workspace }}/fixture/perf_harness
          PROBE_XRAY: ${{ github.workspace }}/fixture/xray-linux-x86_64
          PROBE_OUTPUT: ${{ github.workspace }}/evidence
        run: |
          cargo build --manifest-path source/Cargo.toml --locked --release \
            --target x86_64-unknown-linux-musl -p xp-proxy
          cp source/target/x86_64-unknown-linux-musl/release/xp-proxy fixture/original
          python3 tools/scripts/perf/xp-proxy/diagnose-latency.py "$PWD/fixture/original" original
          python3 tools/scripts/perf/xp-proxy/diagnose-nodelay-patch.py
          git -C source diff > evidence/nodelay.patch
          cargo build --manifest-path source/Cargo.toml --locked --release \
            --target x86_64-unknown-linux-musl -p xp-proxy
          cp source/target/x86_64-unknown-linux-musl/release/xp-proxy fixture/nodelay
          python3 tools/scripts/perf/xp-proxy/diagnose-latency.py "$PWD/fixture/nodelay" nodelay
          python3 tools/scripts/perf/xp-proxy/diagnose-lifecycle-patch.py
          git -C source diff > evidence/scoped-tasks.patch
          cargo build --manifest-path source/Cargo.toml --locked --release \
            --target x86_64-unknown-linux-musl -p xp-proxy
          cp source/target/x86_64-unknown-linux-musl/release/xp-proxy fixture/scoped
          python3 tools/scripts/perf/xp-proxy/diagnose-latency.py "$PWD/fixture/scoped" scoped
          python3 tools/scripts/perf/xp-proxy/diagnose-latency.py \
            "$PWD/fixture/original" original-repeat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: main-transport-diagnosis, path: evidence, retention-days: 7}
