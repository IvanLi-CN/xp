name: ci-performance

on:
  pull_request:
    paths:
      - .github/scripts/performance_assert.py
      - .github/scripts/write-cache-receipt.sh
      - .github/workflows/ci.yml
      - .github/workflows/ci-performance.yml
      - .github/workflows/ci-performance-sample.yml
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          target_sha="${{ inputs.target_sha || github.sha }}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${target_sha}"

  sample:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: {sample: ["1", "2", "3"]}
    name: sample-${{ matrix.sample }}
    uses: ./.github/workflows/ci-performance-sample.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
      sample: ${{ matrix.sample }}

  assert:
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.target_sha || github.sha }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "cache-receipt-*", path: cache-receipts}
      - name: collect job timings
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          jobs_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          gh api --paginate "${jobs_url}" | jq -s '{jobs: map(.jobs[]) }' > jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > run.json
      - name: assert performance
        run: |
          python3 .github/scripts/performance_assert.py \
            --kind ci --jobs jobs.json --run run.json \
            --receipts cache-receipts \
            --output ci-performance.json
      - name: write summary
        run: |
          {
            echo '### CI performance acceptance'
            echo '```json'
            cat ci-performance.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "ci-performance-${{ github.run_id }}", path: ci-performance.json}
