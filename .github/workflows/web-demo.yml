name: web-demo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-demo-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TARGET_SHA: ${{ github.sha }}

jobs:
  demo-build-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ env.TARGET_SHA }}"}
      - name: verify target sha
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "${GITHUB_SHA}" = "${TARGET_SHA}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version-file: .bun-version}
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run build-storybook
      - name: build and test standalone demo
        run: bun run test:e2e:demo
