name: xray-e2e

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xray-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: build embedded web assets
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: login ghcr (retry)
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in {1..6}; do
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; then
              exit 0
            fi

            echo "docker login ghcr.io failed (attempt ${attempt}/6)" >&2
            sleep $((attempt * 5))
          done

          echo "docker login ghcr.io failed after retries" >&2
          exit 1

      - name: xray gRPC e2e
        env:
          XRAY_DOCKER_TAG: 26.3.27
        run: scripts/e2e/run-local-xray-e2e.sh

      - name: Managed HTTPS fallback parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          gh release download v3.48.15 --repo "$GITHUB_REPOSITORY" \
            --pattern xray-linux-x86_64 --pattern cloudflared-linux-x86_64 \
            --pattern checksums.txt --dir "$fixture"
          checksum="$(jq -er '.xray_sha256' scripts/perf/xp-proxy/config.json)"
          printf '%s  %s\n' "$checksum" "$fixture/xray-linux-x86_64" | sha256sum --check
          (cd "$fixture" && sha256sum --check --ignore-missing checksums.txt)
          chmod +x "$fixture/"*-linux-x86_64
          cargo build --locked -p xp -p xp-proxy --bin xp --bin xp-ops --bin xp-proxy
          for bin in xp xp-ops xp-proxy; do
            install -m 0755 "${CARGO_TARGET_DIR:-target}/debug/$bin" "$fixture/$bin"
          done
          python3 scripts/testbox/native-reality-canary.py \
            "$fixture/xp" "$fixture/xp-proxy" \
            "$fixture/xray-linux-x86_64"
          sha256sum "$fixture/xp" "$fixture/xp-ops" "$fixture/xp-proxy"
          sudo env XP_DISPOSABLE_CI_HOST=1 \
            python3 scripts/testbox/native-reality-host.py systemd "$fixture"
          docker run --rm \
            --env XP_DISPOSABLE_CI_HOST=1 \
            --volume "$fixture:/fixture:ro" \
            --volume "$PWD/scripts/testbox/native-reality-host.py:/probe.py:ro" \
            debian:trixie-slim bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                openrc bash curl iproute2 openssl python3
              mkdir -p /run/openrc
              touch /run/openrc/softlevel
              python3 /probe.py openrc /fixture
            '
