name: xp-proxy-perf
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [full, light]
        default: full
      candidate_sha:
        description: Exact candidate commit (empty selects selected ref)
        type: string
        required: false
  workflow_call:
    inputs:
      profile: {type: string, required: true}
      candidate_sha: {type: string, required: true}
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.request.outputs.candidate }}
      baseline: ${{ steps.request.outputs.baseline }}
      applicable: ${{ steps.request.outputs.applicable }}
      execute: ${{ steps.mode.outputs.execute }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate deterministic performance policy contracts
        run: python3 -m unittest discover -s scripts/perf/xp-proxy -p 'test_*.py' -v
      - id: mode
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [[ "$EVENT_ACTION" == labeled || "$EVENT_ACTION" == unlabeled ]]; then
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          fi
      - id: request
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: >-
            ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
        run: python3 scripts/perf/xp-proxy/github.py classify
  protocol-quality:
    needs: request
    if: needs.request.outputs.applicable == 'true' && needs.request.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ needs.request.outputs.candidate }}'}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: {toolchain: 1.96.0, components: 'rustfmt, clippy'}
      - run: cargo test --locked -p xp-proxy -p xp-proxy-core --all-targets
      - run: >-
          cargo clippy --locked -p xp-proxy -p xp-proxy-core
          --all-targets --all-features -- -D warnings
  candidate:
    needs: request
    if: needs.request.outputs.applicable == 'true' && needs.request.outputs.execute == 'true'
    uses: ./.github/workflows/xp-proxy-perf-build.yml
    with:
      source_sha: ${{ needs.request.outputs.candidate }}
      tools_sha: ${{ github.sha }}
      role: candidate
  baseline:
    needs: request
    if: needs.request.outputs.applicable == 'true' && needs.request.outputs.execute == 'true'
    uses: ./.github/workflows/xp-proxy-perf-build.yml
    with:
      source_sha: ${{ needs.request.outputs.baseline }}
      tools_sha: ${{ github.sha }}
      role: main
  interop:
    needs: [request, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "xp-proxy-perf-candidate-\
            ${{ github.run_id }}-${{ github.run_attempt }}-binary"
          path: candidate
      - name: Prepare pinned Xray
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir fixture
          gh release download v3.48.15 --repo "$GITHUB_REPOSITORY" \
            --pattern xray-linux-x86_64 --dir fixture
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          config=json.loads(Path('scripts/perf/xp-proxy/config.json').read_text())
          assert hashlib.sha256(Path('fixture/xray-linux-x86_64').read_bytes()).hexdigest() \
            == config['xray_sha256']
          PYTHON
          chmod +x candidate/* fixture/*
      - name: Xray bidirectional protocol gate
        run: |
          python3 scripts/perf/xp-proxy/interop.py --xp "$PWD/candidate/xp-proxy" \
            --harness "$PWD/candidate/perf_harness" --xray "$PWD/fixture/xray-linux-x86_64" \
            --output "$PWD/interop-xray"
      - name: Multiple destinations and independent client transports
        run: |
          python3 scripts/perf/xp-proxy/topology.py --xp "$PWD/candidate/xp-proxy" \
            --xray "$PWD/fixture/xray-linux-x86_64" --output "$PWD/topology"
      - name: Prepare Mihomo only after Xray passes
        run: scripts/e2e/install-mihomo-v1.19.29.sh "$PWD/fixture/mihomo"
      - name: Mihomo protocol regression gate
        run: |
          python3 scripts/perf/xp-proxy/interop.py --xp "$PWD/candidate/xp-proxy" \
            --harness "$PWD/candidate/perf_harness" --xray "$PWD/fixture/xray-linux-x86_64" \
            --mihomo "$PWD/fixture/mihomo" --output "$PWD/interop-mihomo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xp-proxy-interop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            interop-*/*.json
            interop-*/*.log
            topology/**
          retention-days: 90
  scaling-diagnostic:
    if: inputs.profile == 'full'
    needs: [request, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "xp-proxy-perf-candidate-\
            ${{ github.run_id }}-${{ github.run_attempt }}-binary"
          path: candidate
      - name: Prepare pinned Xray
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir fixture
          gh release download v3.48.15 --repo "$GITHUB_REPOSITORY" \
            --pattern xray-linux-x86_64 --dir fixture
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          config=json.loads(Path('scripts/perf/xp-proxy/config.json').read_text())
          assert hashlib.sha256(Path('fixture/xray-linux-x86_64').read_bytes()).hexdigest() \
            == config['xray_sha256']
          PYTHON
          chmod +x candidate/* fixture/*
      - name: Diagnose Xray scaling without changing formal comparison
        run: |
          python3 scripts/perf/xp-proxy/scaling.py --harness "$PWD/candidate/perf_harness" \
            --xray "$PWD/fixture/xray-linux-x86_64" --output "$PWD/scaling"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xp-proxy-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: scaling/**
          retention-days: 90
  measurement:
    needs: [request, candidate, baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'full' && 10 || 5 }}
    steps:
      - name: Start complete consumer wall clock
        run: echo "PERF_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: xp-proxy-perf-candidate-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: candidate
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: xp-proxy-perf-main-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: main
          merge-multiple: true
      - name: Validate producer identity and prepare pinned fixture
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 scripts/perf/xp-proxy/github.py verify-artifacts
          chmod +x candidate/xp-proxy candidate/perf_harness main/xp-proxy
          mkdir fixture
          gh release download v3.48.15 --repo "$GITHUB_REPOSITORY" \
            --pattern xray-linux-x86_64 --dir fixture
          chmod +x fixture/xray-linux-x86_64
      - name: Measure serial same-run matrix (no compilation)
        id: measure
        env:
          CANDIDATE_SHA: ${{ needs.request.outputs.candidate }}
          BASELINE_SHA: ${{ needs.request.outputs.baseline }}
          PROFILE: ${{ inputs.profile || 'light' }}
        run: |
          python3 scripts/perf/xp-proxy/benchmark.py \
            --candidate "$PWD/candidate" \
            --baseline "$PWD/main" \
            --candidate-sha "$CANDIDATE_SHA" \
            --baseline-sha "$BASELINE_SHA" \
            --xray "$PWD/fixture/xray-linux-x86_64" \
            --profile "$PROFILE" \
            --output "$PWD/evidence"
      - name: Preserve summary and timing on every outcome
        if: always()
        env: {PROFILE: '${{ inputs.profile || ''light'' }}'}
        run: |
          mkdir -p evidence
          [[ ! -f evidence/summary.md ]] || cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perf/xp-proxy/timing.py before-upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xp-proxy-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.md
            evidence/*.log
          retention-days: 90
          if-no-files-found: error
      - name: Include upload in final budget assessment
        if: always()
        env: {PROFILE: '${{ inputs.profile || ''light'' }}'}
        run: python3 scripts/perf/xp-proxy/timing.py after-upload
  gate:
    name: xp-proxy-perf-gate
    timeout-minutes: 17
    if: always() && github.event_name == 'pull_request'
    needs: [request, candidate, baseline, measurement]
    runs-on: ubuntu-24.04
    concurrency:
      group: xp-proxy-perf-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Evaluate latest candidate and human exception independently
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          APPLICABLE: ${{ needs.request.outputs.applicable }}
          EXECUTE: ${{ needs.request.outputs.execute }}
          MEASUREMENT: ${{ needs.measurement.result }}
        run: python3 scripts/perf/xp-proxy/gate.py
