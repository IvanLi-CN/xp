name: resource-evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: verify target sha
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          # The workflow is dispatched from this temporary runner branch while the measured
          # source is the exact release target checked out above.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: {toolchain: 1.96.0}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version-file: .bun-version}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            target
          key: ${{ runner.os }}-resource-evidence-${{ hashFiles('Cargo.lock', 'web/bun.lock') }}
      - name: build embedded web assets
        env:
          XP_WEB_BUILD_ID: ${{ env.TARGET_SHA }}
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: build release candidate and resource workload
        run: |
          set -euo pipefail
          cargo build --locked --release --bin xp
          cargo test --locked --release --test mesh_transport_resource_e2e --no-run
      - name: verify user cgroup support
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo loginctl enable-linger "$(id -un)" || true
          systemctl --user is-system-running
          systemd-run --user --scope --quiet true
      - name: run 128 MiB no-swap resource workloads
        env:
          XP_E2E_XRAY_API_ADDR: 127.0.0.1:1
          XP_MESH_RESOURCE_MODE: shared-testbox
          XP_MESH_RESOURCE_CHILD_CGROUP: "1"
          XP_MESH_RESOURCE_RUN_ID: gha-${{ github.run_id }}
          XP_MESH_RESOURCE_CANDIDATE_BIN: ${{ github.workspace }}/target/release/xp
          XP_MESH_RESOURCE_EXPECT_MEMORY_LIMIT: 128MiB
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          mkdir -p resource-evidence
          log="resource-evidence/resource-workload.log"
          : > "$log"
          cargo test --locked --release --test mesh_transport_resource_e2e \
            xp_source_delivery_journal_memory_e2e --ignored --nocapture 2>&1 | tee -a "$log"
          cargo test --locked --release --test mesh_transport_resource_e2e \
            xp_repository_summary_memory_e2e --ignored --nocapture 2>&1 | tee -a "$log"
      - name: build resource attestation
        if: always()
        run: |
          set -euo pipefail
          test -s resource-evidence/resource-workload.log
          python3 .github/scripts/resource_evidence.py \
            --target-sha "${TARGET_SHA}" \
            --log resource-evidence/resource-workload.log \
            --output resource-evidence/resource-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resource-evidence-${{ github.run_id }}
          path: resource-evidence
          if-no-files-found: error
