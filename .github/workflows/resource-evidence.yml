name: resource-evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string
      candidate_target:
        description: Linux candidate ABI to build, measure and retain
        required: true
        default: native
        type: choice
        options: [native, x86_64-unknown-linux-musl]
      build_version:
        description: Optional approved candidate version (does not publish a release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CANDIDATE_TARGET: ${{ inputs.candidate_target || 'native' }}
      CANDIDATE_BUILD_VERSION: ${{ inputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: verify target sha
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE_BUILD_VERSION" ]]; then
            [[ "$CANDIDATE_BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
            export XP_BUILD_VERSION="$CANDIDATE_BUILD_VERSION"
            echo "XP_BUILD_VERSION=$XP_BUILD_VERSION" >> "$GITHUB_ENV"
          fi
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          # The workflow is dispatched from this temporary runner branch while the measured
          # source is the exact release target checked out above.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: {toolchain: 1.96.0}
      - name: prepare native Linux musl toolchain
        if: inputs.candidate_target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version-file: .bun-version}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            target
          key: >-
            ${{ runner.os }}-resource-evidence-${{ hashFiles('Cargo.lock', 'web/bun.lock') }}-${{
            inputs.candidate_target || 'native' }}
          restore-keys: >-
            ${{ runner.os }}-resource-evidence-${{ hashFiles('Cargo.lock', 'web/bun.lock') }}
      - name: build embedded web assets
        env:
          XP_WEB_BUILD_ID: ${{ env.TARGET_SHA }}
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: build release candidate and resource workload
        run: |
          set -euo pipefail
          case "$CANDIDATE_TARGET" in
            native) candidate=target/release/xp ;;
            x86_64-unknown-linux-musl)
              export CC_x86_64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              candidate=target/x86_64-unknown-linux-musl/release/xp
              ;;
            *) exit 1 ;;
          esac
          if [[ "$CANDIDATE_TARGET" = native ]]; then
            cargo build --locked --release --bin xp --bin xp-ops
          else
            cargo build --locked --release --target "$CANDIDATE_TARGET" --bin xp --bin xp-ops
            cargo test --locked --release --target "$CANDIDATE_TARGET" --lib \
              large_pretty_node_history_guard_stays_bounded -- --ignored --nocapture
          fi
          if [[ "$CANDIDATE_TARGET" = native ]]; then
            cargo test --locked --release --lib backup_cleanup_is_bounded_for_large_files
          else
            cargo test --locked --release --target "$CANDIDATE_TARGET" --lib \
              backup_cleanup_is_bounded_for_large_files
          fi
          echo "XP_MESH_RESOURCE_CANDIDATE_BIN=$GITHUB_WORKSPACE/$candidate" >> "$GITHUB_ENV"
          mkdir -p candidate
          cp "$candidate" candidate/xp
          cp "$(dirname "$candidate")/xp-ops" candidate/xp-ops
          sha256sum candidate/xp candidate/xp-ops > candidate/SHA256SUMS
          printf '%s\n' "$TARGET_SHA" "$CANDIDATE_TARGET" > candidate/source-and-target.txt
          candidate/xp --version > candidate/version.txt
          candidate/xp-ops --version > candidate/ops-version.txt
          if [[ -n "$CANDIDATE_BUILD_VERSION" ]]; then
            test "$(cat candidate/version.txt)" = "xp $CANDIDATE_BUILD_VERSION"
            test "$(cat candidate/ops-version.txt)" = "xp-ops $CANDIDATE_BUILD_VERSION"
          fi
          cargo test --locked --release --test mesh_transport_resource_e2e --no-run
      - name: verify user cgroup support
        run: |
          set -euo pipefail
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          sudo loginctl enable-linger "$(id -un)" || true
          systemctl --user is-system-running
          systemd-run --user --scope --quiet true
      - name: run 128 MiB no-swap resource workloads
        env:
          XP_E2E_XRAY_API_ADDR: 127.0.0.1:1
          XP_MESH_RESOURCE_MODE: shared-testbox
          XP_MESH_RESOURCE_CHILD_CGROUP: "1"
          XP_MESH_RESOURCE_RUN_ID: gha-${{ github.run_id }}
          XP_MESH_RESOURCE_EXPECT_MEMORY_LIMIT: 128MiB
        run: |
          set -euo pipefail
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          mkdir -p resource-evidence
          log="resource-evidence/resource-workload.log"
          : > "$log"
          cargo test --locked --release --test mesh_transport_resource_e2e \
            xp_source_delivery_journal_memory_e2e -- --ignored --nocapture 2>&1 | tee -a "$log"
          cargo test --locked --release --test mesh_transport_resource_e2e \
            xp_repository_summary_memory_e2e -- --ignored --nocapture 2>&1 | tee -a "$log"
      - name: build resource attestation
        if: always()
        run: |
          set -euo pipefail
          test -s resource-evidence/resource-workload.log
          python3 .github/scripts/resource_evidence.py \
            --target-sha "${TARGET_SHA}" \
            --log resource-evidence/resource-workload.log \
            --output resource-evidence/resource-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resource-evidence-${{ github.run_id }}
          path: resource-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: measured-candidate-${{ github.run_id }}
          path: candidate
          if-no-files-found: error
