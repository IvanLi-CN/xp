name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit SHA on main to backfill release for
        required: true
        type: string
      release_type:
        description: Release increment for the approved backfill
        required: true
        type: choice
        options: [patch, minor, major]
      channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, prerelease]
      expected_version:
        description: Exact computed version required before tagging
        required: true
        type: string
      reason:
        description: Short non-sensitive reason for the manual backfill
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: read
  packages: write
  pull-requests: read

env:
  RELEASE_HEAD_SHA: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha ||
    github.event.workflow_run.head_sha }}

concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_dispatch' && inputs.head_sha ||
    github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.intent.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.intent.outputs.is_prerelease }}
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
      image_tags: ${{ steps.image.outputs.tags }}
    steps:
      - name: resolve release head sha
        run: |
          [[ "${RELEASE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
      - name: checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 0}
      - name: determine release intent
        id: intent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          WORKFLOW_RUN_SHA: ${{ env.RELEASE_HEAD_SHA }}
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || '' }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || '' }}
          EXPECTED_VERSION: ${{ inputs.expected_version || '' }}
          RELEASE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || '' }}
        run: bash .github/scripts/release-intent.sh
      - name: verify target workflow readiness
        if: steps.intent.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release_readiness.py
      - name: summary (release intent)
        if: always()
        run: |
          {
            echo '### Release intent'
            echo "- head_sha: ${RELEASE_HEAD_SHA}"
            echo "- should_release: ${{ steps.intent.outputs.should_release }}"
            echo "- source: ${{ steps.intent.outputs.intent_source }}"
            echo "- reason: ${{ steps.intent.outputs.reason }}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: skip release (intent says no)
        if: steps.intent.outputs.should_release != 'true'
        run: 'echo "skip release: intent says no"'
      - name: compute version
        id: version
        if: steps.intent.outputs.should_release == 'true'
        env:
          BUMP_LEVEL: ${{ steps.intent.outputs.bump_level }}
          IS_PRERELEASE: ${{ steps.intent.outputs.is_prerelease }}
        run: .github/scripts/compute-version.sh
      - name: verify expected backfill version
        if: >-
          steps.intent.outputs.should_release == 'true' &&
          github.event_name == 'workflow_dispatch'
        run: test "${{ steps.version.outputs.version }}" = "${{ inputs.expected_version }}"
      - name: prepare docker image tags
        id: image
        if: steps.intent.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.intent.outputs.is_prerelease }}
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/xp"
          {
            echo "tags<<EOF"
            echo "${image}:v${VERSION}"
            echo "${image}:${VERSION}"
            [[ "${IS_PRERELEASE}" == true ]] || echo "${image}:latest"
            echo EOF
          } >> "${GITHUB_OUTPUT}"
      - name: create and push tag (if missing)
        id: release-tag
        if: steps.intent.outputs.should_release == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          version="${{ steps.version.outputs.version }}"
          preferred="v${version}"
          legacy="${version}"
          target="$(git rev-parse "${RELEASE_HEAD_SHA}^{commit}")"; selected=
          for candidate in "$preferred" "$legacy"; do
            if git rev-parse -q --verify "refs/tags/$candidate" >/dev/null; then
              test "$(git rev-list -n 1 "$candidate^{commit}")" = "$target"
              selected="$candidate"; break
            fi
          done
          if [[ -z "$selected" ]]; then
            git tag -a "$preferred" -m "$preferred" "$target"
            git push origin "$preferred"
            selected="$preferred"
          fi
          echo "tag_name=$selected" >> "${GITHUB_OUTPUT}"
      - name: preserve release automation Dockerfile
        if: steps.intent.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "release-automation-${{ github.run_id }}", path: Dockerfile}

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      target_sha: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha ||
        github.event.workflow_run.head_sha }}
      build_version: ${{ needs.prepare.outputs.version }}
      artifact_prefix: release-${{ github.run_id }}
      cache_scope: release

  publish-image:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ env.RELEASE_HEAD_SHA }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: "release-automation-${{ github.run_id }}", path: .release-automation}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "*-${{ github.run_id }}-*", path: release, merge-multiple: true}
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        env: {DOCKER_BUILD_EXPORT_LEGACY: true}
        with:
          context: .
          file: .release-automation/Dockerfile
          target: runtime-from-prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.prepare.outputs.image_tags }}
          build-args: XP_BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime

  publish-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "*-${{ github.run_id }}-*", path: release, merge-multiple: true}
      - run: cd release && sha256sum -- *-linux-* > checksums.txt && sha256sum --check checksums.txt
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          tag: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.tag_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: release/*
          artifactErrorsFailBuild: true
          replacesArtifacts: true
