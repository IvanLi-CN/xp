name: release

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit SHA on main to backfill release for
        required: true
        type: string
      release_type:
        description: Release increment for the approved backfill
        required: true
        type: choice
        options: [patch, minor, major]
      channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, prerelease]
      expected_version:
        description: Exact computed version required before tagging
        required: true
        type: string
      reason:
        description: Short non-sensitive reason for the manual backfill
        required: true
        type: string
      resource_evidence_ref:
        description: >-
          Evidence commit SHA whose only parent is head_sha and which contains the Agent VM log
          and attestation
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: read
  packages: write
  pull-requests: read

env:
  RELEASE_HEAD_SHA: ${{ inputs.head_sha }}

concurrency:
  group: release-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.intent.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.intent.outputs.is_prerelease }}
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
      image_tags: ${{ steps.image.outputs.tags }}
    steps:
      - name: resolve release head sha
        run: |
          test "${GITHUB_ACTOR,,}" = "${GITHUB_REPOSITORY_OWNER,,}"
          test "${GITHUB_TRIGGERING_ACTOR,,}" = "${GITHUB_REPOSITORY_OWNER,,}"
          [[ "${RELEASE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
      - name: checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 0}
      - name: determine release intent
        id: intent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: manual
          WORKFLOW_RUN_SHA: ${{ env.RELEASE_HEAD_SHA }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: bash .github/scripts/release-intent.sh
      - name: checkout Agent VM evidence commit
        if: steps.intent.outputs.should_release == 'true'
        env:
          EVIDENCE_REF: ${{ inputs.resource_evidence_ref }}
        run: |
          set -euo pipefail
          [[ "${EVIDENCE_REF}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "${EVIDENCE_REF}"
          evidence_commit="$(git rev-parse "${EVIDENCE_REF}^{commit}")"
          parents=( $(git rev-list --parents -n1 "${evidence_commit}") )
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "${RELEASE_HEAD_SHA}"
          mapfile -t evidence_paths < <(
            git diff-tree --no-commit-id --name-only -r "${evidence_commit}"
          )
          test "${#evidence_paths[@]}" -eq 2
          test "${evidence_paths[0]}" = "agent-vm-resource-evidence.json"
          test "${evidence_paths[1]}" = "agent-vm-resource.log"
          mkdir -p .release-evidence
          git show \
            "${evidence_commit}:agent-vm-resource-evidence.json" \
            > .release-evidence/evidence.json
          git show "${evidence_commit}:agent-vm-resource.log" > .release-evidence/workload.log
          echo "${evidence_commit}" > .release-evidence/commit
      - name: verify signed Agent VM evidence commit
        if: steps.intent.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence_commit="$(cat .release-evidence/commit)"
          trusted_fingerprint="39CE251C234BA4C727C5BEA061F8690632D072E2"
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf "${gnupg_home}"' EXIT
          chmod 700 "${gnupg_home}"
          export GNUPGHOME="${gnupg_home}"
          curl --fail --silent --show-error --location \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg" \
            | gpg --batch --import
          verify_output="$(git verify-commit --raw "${evidence_commit}" 2>&1)"
          signer_fingerprint="$(awk '$2 == "VALIDSIG" {print $3; exit}' <<<"${verify_output}")"
          test "${signer_fingerprint}" = "${trusted_fingerprint}"
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${evidence_commit}")"
          test "$(jq -r '.commit.verification.verified' <<<"${verification}")" = "true"
          test "$(jq -r '.commit.verification.reason' <<<"${verification}")" = "valid"
          test "$(jq -r '.author.login // empty' <<<"${verification}")" = \
            "${GITHUB_REPOSITORY_OWNER}"
          test "$(jq -r '.committer.login // empty' <<<"${verification}")" = \
            "${GITHUB_REPOSITORY_OWNER}"
          {
            echo "evidence_commit=${evidence_commit}"
            echo "verified_author=$(jq -r '.author.login' <<<"${verification}")"
            echo "verified_committer=$(jq -r '.committer.login' <<<"${verification}")"
          } > .release-evidence/manifest.txt
          {
            echo "- evidence_commit: ${evidence_commit}"
            echo "- evidence_signature: GitHub verified/valid"
            echo "- evidence_author: $(jq -r '.author.login' <<<"${verification}")"
            echo "- evidence_committer: $(jq -r '.committer.login' <<<"${verification}")"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: verify target workflow readiness
        if: steps.intent.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/scripts/release_readiness.py
          --resource-evidence-file .release-evidence/evidence.json
          --resource-log-file .release-evidence/workload.log
      - name: summary (release intent)
        if: always()
        run: |
          {
            echo '### Release intent'
            echo "- head_sha: ${RELEASE_HEAD_SHA}"
            echo "- should_release: ${{ steps.intent.outputs.should_release }}"
            echo "- source: ${{ steps.intent.outputs.intent_source }}"
            echo "- reason: ${{ steps.intent.outputs.reason }}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: skip release (intent says no)
        if: steps.intent.outputs.should_release != 'true'
        run: 'echo "skip release: intent says no"'
      - name: compute version
        id: version
        if: steps.intent.outputs.should_release == 'true'
        env:
          BUMP_LEVEL: ${{ steps.intent.outputs.bump_level }}
          IS_PRERELEASE: ${{ steps.intent.outputs.is_prerelease }}
        run: .github/scripts/compute-version.sh
      - name: verify expected backfill version
        if: steps.intent.outputs.should_release == 'true'
        run: test "${{ steps.version.outputs.version }}" = "${{ inputs.expected_version }}"
      - name: prepare docker image tags
        id: image
        if: steps.intent.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.intent.outputs.is_prerelease }}
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/xp"
          {
            echo "tags<<EOF"
            echo "${image}:v${VERSION}"
            echo "${image}:${VERSION}"
            [[ "${IS_PRERELEASE}" == true ]] || echo "${image}:latest"
            echo EOF
          } >> "${GITHUB_OUTPUT}"
      - name: create and push tag (if missing)
        id: release-tag
        if: steps.intent.outputs.should_release == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          version="${{ steps.version.outputs.version }}"
          preferred="v${version}"
          legacy="${version}"
          target="$(git rev-parse "${RELEASE_HEAD_SHA}^{commit}")"; selected=
          for candidate in "$preferred" "$legacy"; do
            if git rev-parse -q --verify "refs/tags/$candidate" >/dev/null; then
              test "$(git rev-list -n 1 "$candidate^{commit}")" = "$target"
              selected="$candidate"; break
            fi
          done
          if [[ -z "$selected" ]]; then
            git tag -a "$preferred" -m "$preferred" "$target"
            git push origin "$preferred"
            selected="$preferred"
          fi
          echo "tag_name=$selected" >> "${GITHUB_OUTPUT}"
      - name: preserve release automation Dockerfile
        if: steps.intent.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "release-automation-${{ github.run_id }}", path: Dockerfile}
      - name: preserve Agent VM evidence
        if: steps.intent.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "agent-vm-evidence-${{ github.run_id }}"
          path: .release-evidence
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      target_sha: >-
        ${{ inputs.head_sha }}
      build_version: ${{ needs.prepare.outputs.version }}
      artifact_prefix: release-${{ github.run_id }}
      cache_scope: release

  publish-static-web:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDGEONE_MAKERS_PROJECT: ${{ vars.EDGEONE_MAKERS_PROJECT }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "web-release-release-${{ github.run_id }}"
          path: web-release
      - name: verify EdgeOne deployment prerequisites
        run: |
          set -euo pipefail
          test -n "${EDGEONE_MAKERS_PROJECT}"
          test "${EDGEONE_MAKERS_PROJECT}" = "xp-web"
          test -n "${EDGEONE_API_TOKEN}"
      - name: verify Web archive
        env:
          TARGET_SHA: ${{ env.RELEASE_HEAD_SHA }}
          WEB_BUILD_ID: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          manifest="web-release/xp-web-manifest.json"
          archive="web-release/xp-web-${WEB_BUILD_ID}-${TARGET_SHA}.tar.gz"
          test -f "${manifest}"
          test -f "${archive}"
          sha256sum --check "${archive}.sha256"
          python3 - "${manifest}" "${TARGET_SHA}" "${WEB_BUILD_ID}" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text())
          if manifest.get("target_sha") != sys.argv[2]:
              raise SystemExit("Web archive target SHA mismatch")
          if manifest.get("web_build_id") != sys.argv[3]:
              raise SystemExit("Web archive build ID mismatch")
          PY
      - name: deploy Web to EdgeOne Makers
        run: |
          set -euo pipefail
          mkdir -p web-deploy
          version="${{ needs.prepare.outputs.version }}"
          target_sha="${{ env.RELEASE_HEAD_SHA }}"
          archive="web-release/xp-web-${version}-${target_sha}.tar.gz"
          tar -xzf "${archive}" -C web-deploy
          npx --yes edgeone@1.6.33 makers deploy ./web-deploy \
            -n "${EDGEONE_MAKERS_PROJECT}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production
      - name: verify public static Web deployment
        run: |
          python3 .github/scripts/static_web_smoke.py \
            --url https://xp.ivanli.cc/ \
            --build-id "${{ needs.prepare.outputs.version }}" \
            --bootstrap-origin https://101-xp.ivanli.cc \
            --timeout-seconds 300

  publish-image:
    needs: [prepare, build, publish-static-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ env.RELEASE_HEAD_SHA }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: "release-automation-${{ github.run_id }}", path: .release-automation}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "*-${{ github.run_id }}-*", path: release, merge-multiple: true}
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        env: {DOCKER_BUILD_EXPORT_LEGACY: true}
        with:
          context: .
          file: .release-automation/Dockerfile
          target: runtime-from-prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.prepare.outputs.image_tags }}
          build-args: XP_BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime

  publish-release:
    needs: [prepare, build, publish-static-web, publish-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "*-${{ github.run_id }}-*", path: release, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "agent-vm-evidence-${{ github.run_id }}"
          path: release/evidence
      - name: include Agent VM evidence in release assets
        run: |
          set -euo pipefail
          cp release/evidence/commit release/agent-vm-evidence-commit.txt
          cp release/evidence/manifest.txt release/agent-vm-evidence-manifest.txt
          cp release/evidence/evidence.json release/agent-vm-resource-evidence.json
          cp release/evidence/workload.log release/agent-vm-resource.log
          rm -rf release/evidence
      - run: cd release && sha256sum -- *-linux-* > checksums.txt && sha256sum --check checksums.txt
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          tag: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.tag_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: release/*
          artifactErrorsFailBuild: true
          replacesArtifacts: true
