name: release-performance

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/scripts/performance_assert.py
      - .github/workflows/release-build.yml
      - .github/workflows/release-performance.yml
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          target_sha="${{ inputs.target_sha || github.sha }}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${target_sha}"

  build:
    needs: verify
    uses: ./.github/workflows/release-build.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
      build_version: 0.0.0-perf.${{ github.run_id }}
      artifact_prefix: perf-${{ github.run_id }}
      cache_scope: release

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.target_sha || github.sha }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "*-${{ github.run_id }}-*", path: release, merge-multiple: true}
      - name: verify asset manifest
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 8
          (cd release && sha256sum -- *-linux-* > checksums.txt && sha256sum --check checksums.txt)
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        env: {DOCKER_BUILD_EXPORT_LEGACY: true}
        with:
          context: .
          target: runtime-from-prebuilt
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          build-args: XP_BUILD_VERSION=0.0.0-perf.${{ github.run_id }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest-${{ github.run_id }}
          path: release/checksums.txt

  assert:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.target_sha || github.sha }}"}
      - name: collect and assert timings
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          jobs_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          gh api --paginate "${jobs_url}" | jq -s '{jobs: map(.jobs[]) }' > jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > run.json
          python3 .github/scripts/performance_assert.py \
            --kind release --jobs jobs.json --run run.json \
            --output release-performance.json
      - name: write summary
        run: cat release-performance.json >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "release-performance-${{ github.run_id }}", path: release-performance.json}
