<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title description">
  <title id="title">XP product poster</title>
  <desc id="description">A 4 by 5 product poster for XP, a self-hosted Xray cluster manager.</desc>
  <defs>
    <line id="xp-radial-link" x1="512" y1="313" x2="512" y2="417" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <line id="xp-outer-link" x1="587.344" y1="269.5" x2="684.339" y2="325.5" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <circle id="xp-outer-node" cx="512" cy="226" r="62" fill="currentColor"/>
    <g id="xp-approved-bicolor-mark">
      <g color="#4CB1AB">
        <use href="#xp-outer-link"/><use href="#xp-outer-link" transform="rotate(60 512 512)"/><use href="#xp-outer-link" transform="rotate(120 512 512)"/><use href="#xp-outer-link" transform="rotate(180 512 512)"/><use href="#xp-outer-link" transform="rotate(240 512 512)"/><use href="#xp-outer-link" transform="rotate(300 512 512)"/>
        <use href="#xp-radial-link"/><use href="#xp-radial-link" transform="rotate(60 512 512)"/><use href="#xp-radial-link" transform="rotate(120 512 512)"/><use href="#xp-radial-link" transform="rotate(180 512 512)"/><use href="#xp-radial-link" transform="rotate(240 512 512)"/><use href="#xp-radial-link" transform="rotate(300 512 512)"/>
        <use href="#xp-outer-node"/><use href="#xp-outer-node" transform="rotate(60 512 512)"/><use href="#xp-outer-node" transform="rotate(120 512 512)"/><use href="#xp-outer-node" transform="rotate(180 512 512)"/><use href="#xp-outer-node" transform="rotate(240 512 512)"/><use href="#xp-outer-node" transform="rotate(300 512 512)"/>
      </g>
      <circle cx="512" cy="512" r="70" fill="#72CCA3"/>
    </g>
    <pattern id="xp-grid" width="128" height="148" patternUnits="userSpaceOnUse">
      <path d="M0 74L64 37L128 74M0 74L64 111L128 74M64 0V37M64 111V148" fill="none" stroke="#4CB1AB" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="2000" fill="#111817"/>
  <rect width="1600" height="2000" fill="url(#xp-grid)"/>

  <use href="#xp-approved-bicolor-mark" transform="translate(126 116) scale(0.16)"/>
  <text x="326" y="240" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700">XP</text>
  <text x="132" y="370" fill="#72CCA3" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">SELF-HOSTED XRAY CLUSTER MANAGEMENT</text>

  <text x="126" y="550" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="122" font-weight="700">One control plane</text>
  <text x="126" y="693" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="122" font-weight="700">for your Xray cluster.</text>
  <text x="132" y="795" fill="#C8D4D1" font-family="Arial, Helvetica, sans-serif" font-size="42">Self-hosted management for nodes, endpoints, access, and quotas.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <use href="#xp-approved-bicolor-mark" transform="translate(672 777) scale(0.65)"/>

    <line x1="132" y1="1438" x2="1468" y2="1438" stroke="#4CB1AB" stroke-opacity="0.5" stroke-width="2"/>
    <text x="132" y="1514" fill="#72CCA3" font-size="24" font-weight="700">01</text>
    <text x="132" y="1562" fill="#FFFFFF" font-size="34" font-weight="700">Raft-backed desired state</text>
    <text x="132" y="1610" fill="#B4C1BE" font-size="28">One consistent cluster configuration.</text>

    <text x="850" y="1514" fill="#72CCA3" font-size="24" font-weight="700">02</text>
    <text x="850" y="1562" fill="#FFFFFF" font-size="34" font-weight="700">Xray runtime reconciliation</text>
    <text x="850" y="1610" fill="#B4C1BE" font-size="28">Desired state stays connected to the local runtime.</text>

    <text x="132" y="1714" fill="#72CCA3" font-size="24" font-weight="700">03</text>
    <text x="132" y="1762" fill="#FFFFFF" font-size="34" font-weight="700">Subscription output</text>
    <text x="132" y="1810" fill="#B4C1BE" font-size="28">Raw URI, Base64, and Clash YAML.</text>

    <text x="850" y="1714" fill="#72CCA3" font-size="24" font-weight="700">04</text>
    <text x="850" y="1762" fill="#FFFFFF" font-size="34" font-weight="700">Deployment flexibility</text>
    <text x="850" y="1810" fill="#B4C1BE" font-size="28">Systemd, OpenRC, and container deployment.</text>

    <line x1="132" y1="1876" x2="1468" y2="1876" stroke="#4CB1AB" stroke-opacity="0.5" stroke-width="2"/>
    <text x="132" y="1935" fill="#FFFFFF" font-size="27" font-weight="700">github.com/IvanLi-CN/xp</text>
    <text x="1468" y="1935" fill="#72CCA3" font-size="27" font-weight="700" text-anchor="end">CONTROL YOUR CLUSTER</text>
  </g>
</svg>
