<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">XP product poster</title>
  <desc id="description">A 4 by 5 product poster for XP, showing one control plane for desired state, endpoints, access, quotas, subscriptions, and self-hosted node operations.</desc>
  <defs>
    <line id="radial-link" x1="512" y1="313" x2="512" y2="417" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <line id="outer-link" x1="587.344" y1="269.5" x2="684.339" y2="325.5" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <circle id="outer-node" cx="512" cy="226" r="62" fill="currentColor"/>
    <g id="approved-bicolor-mark">
      <g color="#4CB1AB">
        <use href="#outer-link"/><use href="#outer-link" transform="rotate(60 512 512)"/><use href="#outer-link" transform="rotate(120 512 512)"/><use href="#outer-link" transform="rotate(180 512 512)"/><use href="#outer-link" transform="rotate(240 512 512)"/><use href="#outer-link" transform="rotate(300 512 512)"/>
        <use href="#radial-link"/><use href="#radial-link" transform="rotate(60 512 512)"/><use href="#radial-link" transform="rotate(120 512 512)"/><use href="#radial-link" transform="rotate(180 512 512)"/><use href="#radial-link" transform="rotate(240 512 512)"/><use href="#radial-link" transform="rotate(300 512 512)"/>
        <use href="#outer-node"/><use href="#outer-node" transform="rotate(60 512 512)"/><use href="#outer-node" transform="rotate(120 512 512)"/><use href="#outer-node" transform="rotate(180 512 512)"/><use href="#outer-node" transform="rotate(240 512 512)"/><use href="#outer-node" transform="rotate(300 512 512)"/>
      </g>
      <circle cx="512" cy="512" r="70" fill="#72CCA3"/>
    </g>
    <g id="approved-wordmark" fill="#F8FBFA" fill-rule="evenodd">
      <path d="M0 0H50L102 70L154 0H204L132 100L204 200H154L102 130L50 200H0L72 100Z"/>
      <path d="M240 0H332C390 0 430 32 430 80S390 160 332 160H292V200H240ZM292 48V112H331C361 112 380 100 380 80S361 48 331 48Z"/>
    </g>
    <pattern id="edge-hexes" width="128" height="148" patternUnits="userSpaceOnUse">
      <path d="M0 74L64 37L128 74M0 74L64 111L128 74M64 0V37M64 111V148" fill="none" stroke="#4CB1AB" stroke-opacity="0.1" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="2000" fill="#111817"/>
  <rect width="1600" height="2000" fill="url(#edge-hexes)"/>

  <g transform="translate(130 90) scale(0.6)">
    <g transform="translate(-364 -88)">
      <use href="#approved-bicolor-mark" transform="translate(318.8 52.529) scale(0.287356)"/>
      <use href="#approved-wordmark" transform="translate(595.5 150) scale(0.53)"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="132" y="400" fill="#F8FBFA" font-size="98" font-weight="700">One control plane</text>
    <text x="132" y="502" fill="#F8FBFA" font-size="80" font-weight="700">for every self-hosted node.</text>
    <text x="132" y="576" fill="#C8D4D1" font-size="34">Manage endpoints, users, quotas, and subscriptions across the cluster.</text>

    <image href="xp-poster-v6-mechanism.png" x="200" y="620" width="1200" height="920" preserveAspectRatio="none"/>

    <line x1="132" y1="1650" x2="1468" y2="1650" stroke="#4CB1AB" stroke-opacity="0.46" stroke-width="2"/>
    <line x1="800" y1="1650" x2="800" y2="1854" stroke="#4CB1AB" stroke-opacity="0.34" stroke-width="2"/>
    <line x1="132" y1="1752" x2="1468" y2="1752" stroke="#4CB1AB" stroke-opacity="0.34" stroke-width="2"/>

    <circle cx="145" cy="1696" r="8" fill="#72CCA3"/>
    <text x="172" y="1706" fill="#F8FBFA" font-size="31" font-weight="700">Raft-backed desired state</text>
    <circle cx="863" cy="1696" r="8" fill="#72CCA3"/>
    <text x="890" y="1706" fill="#F8FBFA" font-size="31" font-weight="700">Endpoints and access</text>
    <circle cx="145" cy="1804" r="8" fill="#72CCA3"/>
    <text x="172" y="1814" fill="#F8FBFA" font-size="31" font-weight="700">Quotas and subscriptions</text>
    <circle cx="863" cy="1804" r="8" fill="#72CCA3"/>
    <text x="890" y="1814" fill="#F8FBFA" font-size="29" font-weight="700">Systemd, OpenRC, and containers</text>

    <line x1="132" y1="1888" x2="1468" y2="1888" stroke="#4CB1AB" stroke-opacity="0.46" stroke-width="2"/>
    <text x="132" y="1950" fill="#F8FBFA" font-size="28" font-weight="700">github.com/IvanLi-CN/xp</text>
  </g>
</svg>
