<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img" aria-labelledby="title description">
  <title id="title">XP horizontal product logo optical size study</title>
  <desc id="description">Three controlled XP product logo lockups. The approved bicolor mark stays on the left and the custom XP wordmark stays on the right. Only the mark height varies from 94 to 106 percent of the wordmark height.</desc>
  <defs>
    <line id="radial-link" x1="512" y1="313" x2="512" y2="417" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <line id="outer-link" x1="587.344" y1="269.5" x2="684.339" y2="325.5" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <circle id="outer-node" cx="512" cy="226" r="62" fill="currentColor"/>
    <g id="xp-approved-bicolor-mark">
      <g color="#4CB1AB">
        <use href="#outer-link"/><use href="#outer-link" transform="rotate(60 512 512)"/><use href="#outer-link" transform="rotate(120 512 512)"/><use href="#outer-link" transform="rotate(180 512 512)"/><use href="#outer-link" transform="rotate(240 512 512)"/><use href="#outer-link" transform="rotate(300 512 512)"/>
        <use href="#radial-link"/><use href="#radial-link" transform="rotate(60 512 512)"/><use href="#radial-link" transform="rotate(120 512 512)"/><use href="#radial-link" transform="rotate(180 512 512)"/><use href="#radial-link" transform="rotate(240 512 512)"/><use href="#radial-link" transform="rotate(300 512 512)"/>
        <use href="#outer-node"/><use href="#outer-node" transform="rotate(60 512 512)"/><use href="#outer-node" transform="rotate(120 512 512)"/><use href="#outer-node" transform="rotate(180 512 512)"/><use href="#outer-node" transform="rotate(240 512 512)"/><use href="#outer-node" transform="rotate(300 512 512)"/>
      </g>
      <circle cx="512" cy="512" r="70" fill="#72CCA3"/>
    </g>
    <g id="xp-wordmark" fill="#F8FBFA" fill-rule="evenodd">
      <path d="M0 0H50L102 70L154 0H204L132 100L204 200H154L102 130L50 200H0L72 100Z"/>
      <path d="M240 0H332C390 0 430 32 430 80S390 160 332 160H292V200H240ZM292 48V112H331C361 112 380 100 380 80S361 48 331 48Z"/>
    </g>
  </defs>

  <rect width="1600" height="1360" fill="#111817"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="94" fill="#72CCA3" font-size="23" font-weight="700">XP PRODUCT LOGO</text>
    <text x="112" y="148" fill="#F8FBFA" font-size="42" font-weight="700">Horizontal lockup size study</text>
    <text x="112" y="188" fill="#B4C1BE" font-size="24">One fixed relationship; only symbol scale changes.</text>

    <line x1="112" y1="220" x2="1488" y2="220" stroke="#4CB1AB" stroke-opacity="0.45" stroke-width="2"/>

    <text x="112" y="388" fill="#72CCA3" font-size="22" font-weight="700">A / 94%</text>
    <use href="#xp-approved-bicolor-mark" transform="translate(215.724 241.724) scale(0.270115)"/>
    <use href="#xp-wordmark" transform="translate(486 280)"/>

    <line x1="112" y1="540" x2="1488" y2="540" stroke="#4CB1AB" stroke-opacity="0.28" stroke-width="2"/>

    <text x="112" y="768" fill="#72CCA3" font-size="22" font-weight="700">B / 100%</text>
    <use href="#xp-approved-bicolor-mark" transform="translate(212.989 612.529) scale(0.287356)"/>
    <use href="#xp-wordmark" transform="translate(500 660)"/>

    <line x1="112" y1="920" x2="1488" y2="920" stroke="#4CB1AB" stroke-opacity="0.28" stroke-width="2"/>

    <text x="112" y="1148" fill="#72CCA3" font-size="22" font-weight="700">C / 106%</text>
    <use href="#xp-approved-bicolor-mark" transform="translate(210.253 923.333) scale(0.304598)"/>
    <use href="#xp-wordmark" transform="translate(514 1040)"/>
  </g>
</svg>
