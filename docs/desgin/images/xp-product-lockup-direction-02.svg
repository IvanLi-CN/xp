<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">XP product lockup direction two</title>
  <desc id="description">A product logo that pairs the unchanged approved bicolor network mark with a dominant custom XP wordmark built from stable geometric forms.</desc>
  <defs>
    <line id="xp-radial-link" x1="512" y1="313" x2="512" y2="417" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <line id="xp-outer-link" x1="587.344" y1="269.5" x2="684.339" y2="325.5" stroke="currentColor" stroke-linecap="round" stroke-width="20"/>
    <circle id="xp-outer-node" cx="512" cy="226" r="62" fill="currentColor"/>
    <g id="xp-approved-bicolor-mark">
      <g color="#4CB1AB">
        <use href="#xp-outer-link"/><use href="#xp-outer-link" transform="rotate(60 512 512)"/><use href="#xp-outer-link" transform="rotate(120 512 512)"/><use href="#xp-outer-link" transform="rotate(180 512 512)"/><use href="#xp-outer-link" transform="rotate(240 512 512)"/><use href="#xp-outer-link" transform="rotate(300 512 512)"/>
        <use href="#xp-radial-link"/><use href="#xp-radial-link" transform="rotate(60 512 512)"/><use href="#xp-radial-link" transform="rotate(120 512 512)"/><use href="#xp-radial-link" transform="rotate(180 512 512)"/><use href="#xp-radial-link" transform="rotate(240 512 512)"/><use href="#xp-radial-link" transform="rotate(300 512 512)"/>
        <use href="#xp-outer-node"/><use href="#xp-outer-node" transform="rotate(60 512 512)"/><use href="#xp-outer-node" transform="rotate(120 512 512)"/><use href="#xp-outer-node" transform="rotate(180 512 512)"/><use href="#xp-outer-node" transform="rotate(240 512 512)"/><use href="#xp-outer-node" transform="rotate(300 512 512)"/>
      </g>
      <circle cx="512" cy="512" r="70" fill="#72CCA3"/>
    </g>
    <g id="xp-wordmark-solid" fill="currentColor" fill-rule="evenodd">
      <path d="M0 0H50L90 58L130 0H180L120 90L180 180H130L90 122L50 180H0L60 90Z"/>
      <path d="M214 0H300C352 0 390 36 390 88C390 140 352 176 300 176H266V180H214ZM266 44V132H299C325 132 340 114 340 88C340 62 325 44 299 44Z"/>
    </g>
    <g id="xp-product-lockup-dark" color="#F8FBFA">
      <use href="#xp-approved-bicolor-mark" transform="translate(0 13) scale(0.15)"/>
      <use href="#xp-wordmark-solid" transform="translate(198 0)"/>
    </g>
    <g id="xp-product-lockup-light" color="#111817">
      <use href="#xp-approved-bicolor-mark" transform="translate(0 13) scale(0.15)"/>
      <use href="#xp-wordmark-solid" transform="translate(198 0)"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#101716"/>
  <text x="112" y="104" fill="#72CCA3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">XP PRODUCT LOCKUP / DIRECTION 02</text>

  <rect x="112" y="168" width="1376" height="254" fill="#111817" stroke="#2F5E59" stroke-width="2"/>
  <use href="#xp-product-lockup-dark" transform="translate(532 205)"/>

  <rect x="112" y="506" width="1376" height="254" fill="#F8FBFA"/>
  <use href="#xp-product-lockup-light" transform="translate(532 543)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <text x="112" y="460" fill="#B4C1BE">DARK FIELD</text>
    <text x="112" y="798" fill="#B4C1BE">LIGHT FIELD</text>
  </g>
</svg>
